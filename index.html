 (e) {}\n  Object.keys(KID).forEach(k => delete KID[k]);   // child details cached for the pills must not outlive the session\n  try { PLS = []; PK = null; } catch (e) {}   // plans stay on the device under this user's key, but are cleared from the screen\n  $('log').innerHTML = ''; $('inst').style.display = 'none'; chatHist = []; $('p').value = ''; $('err').textContent = msg || ''; show(false);\n}\n\n/* auto sign-out after 10 min without touching the app (protects child data on shared phones) */\nconst IDLE_MS = 10 * 60 * 1000, IDLE_MSG = 'បានចាកចេញដោយសារមិនប្រើប្រាស់។ សូមចូលម្តងទៀត។\\nSigned out due to inactivity.';\nlet lastAct = Date.now();\n['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));\nconst idleCheck = () => { if (!EMBED && token && Date.now() - lastAct > IDLE_MS) signOut(IDLE_MSG); };\nsetInterval(idleCheck, 15000);\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); });\n\n$('go').onclick = async () => {\n  $('err').textContent = ''; $('go').disabled = true;\n  try {\n    const d = await call({ action: 'login', username: $('u').value, password: $('p').value, token: null });\n    if (d.ok) { token = d.token; try { sessionStorage.setItem('cvc_t', token); sessionStorage.setItem('cvc_u', $('u').value.trim().toLowerCase()); sessionStorage.setItem('cvc_r', d.role || ''); sessionStorage.setItem('cvc_d', d.dash ? '1' : ''); } catch (e) {} wipeChats(chatKey()); $('p').value = ''; signedIn(d.name); }\n    else $('err').textContent = d.message || 'Sign in failed.';\n  } catch (e) { console.error(e); $('err').textContent = NETMSG(e); }\n  $('go').disabled = false;\n};\n$('p').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });\n$('out').onclick = () => signOut();\n\n/* ---------------- RC date alerts (Web Push) ---------------- */\nconst VAPID_PUBLIC = 'BPGexqdvC5gJAr-DFRkwFeIj8bdAoCYnugAjItTAQ1nPE8L4carUNJjriLiozqjoUZbgNIrzGvm8KSZYdXv9OOA';\nconst PUSH_OK = !EMBED && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;\nconst urlB64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };\n\nasync function alertState() {   // shows 🔔 when this phone is subscribed; re-sends the subscription so the sheet always has the current user\n  let on = false;\n  try {\n    if (PUSH_OK && Notification.permission === 'granted') {\n      const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();\n      if (sub) { on = true; call({ action: 'subscribe', sub: sub.toJSON() }).catch(() => {}); syncPlans(); }\n    }\n  } catch (e) {}\n  $('alertb').textContent = on ? '🔔' : '🔕'; $('alertb').dataset.on = on ? '1' : '';\n  return on;\n}\nasync function alertsOn() {\n  if (EMBED) { add('bot', 'ការជូនដំណឹងពេលបិទកម្មវិធី ដំណើរការក្នុងកម្មវិធី «ជំនួយការ CVC» ដែលបានដំឡើងលើអេក្រង់ដើមប៉ុណ្ណោះ។ ផែនការក្នុងប្រតិទិនរបស់អ្នកនៅដដែល។\\nAlerts for when the app is closed work in the installed CVC Assistant app. Your calendar plans are the same in both.'); return; }\n  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;\n  if (ios && !standalone) { add('bot', 'សម្រាប់ iPhone សូមបន្ថែមកម្មវិធីនេះទៅអេក្រង់ដើម (Share → Add to Home Screen) រួចបើកពីទីនោះ ទើបទទួលបានការជូនដំណឹង។\\nOn iPhone, first add this app to the Home Screen (Share → Add to Home Screen), then open it from there.'); return; }\n  if (!PUSH_OK) { add('bot', 'ឧបករណ៍ ឬកម្មវិធីរុករកនេះមិនគាំទ្រការជូនដំណឹងទេ។\\nThis device or browser does not support alerts.'); return; }\n  if (await Notification.requestPermission() !== 'granted') { add('bot', 'អ្នកមិនបានអនុញ្ញាតការជូនដំណឹងទេ។ សូមបើកវានៅក្នុងការកំណត់កម្មវិធីរុករក។\\nAlerts were not allowed. Please enable them in the browser settings.'); return; }\n  if (!VAPID_PUBLIC || /PASTE/i.test(VAPID_PUBLIC)) { add('bot', '⚠️ VAPID_PUBLIC is still the placeholder in index.html. Paste the real public key (from generate-vapid-keys) and upload the file again.'); return; }\n  try {\n    const reg = await navigator.serviceWorker.ready;\n    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC) });\n    const d = await call({ action: 'subscribe', sub: sub.toJSON() });\n    if (d.error === 'SESSION') { signOut(d.message); return; }\n    if (!d.ok) throw new Error('save failed'); syncPlans();\n    add('bot', '🔔 បានបើកការជូនដំណឹងថ្ងៃតាមដាន RC ហើយ។ អ្នកនឹងទទួលបានសារ ទោះបើបិទកម្មវិធីក៏ដោយ។\\nRC monitoring date alerts are on. You will get them even when the app is closed.');\n  } catch (e) { console.error(e); add('bot', 'មិនអាចបើកការជូនដំណឹងបានទេ សូមព្យាយាមម្តងទៀត។\\nCould not turn on alerts. Please try again.\\n[' + (e && e.name) + ': ' + (e && e.message) + ']'); }\n  alertState();\n}\nasync function alertsOff() {\n  try {\n    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();\n    if (sub) { const end = sub.endpoint; await sub.unsubscribe(); call({ action: 'unsubscribe', endpoint: end }).catch(() => {}); }\n  } catch (e) {}\n  add('bot', '🔕 បានបិទការជូនដំណឹង។\\nAlerts are off.'); alertState();\n}\n$('alertb').onclick = () => { if ($('alertb').dataset.on) alertsOff(); else alertsOn(); };\n\n\n$('f').onsubmit = e => { e.preventDefault(); const q = $('q').value.trim(); if (!q) return; $('q').value = ''; $('q').style.height = 'auto'; runAsk(q, q, false); };\nasync function runAsk(q, shown, follow) {\n  stopSpeak(); unlockTts();\n  const oldOpt = $('optrow'); if (oldOpt) oldOpt.remove(); const oldFu = $('fup'); if (oldFu) oldFu.remove();\n  add('me', shown); $('send').disabled = true;\n  const w = add('bot', '…'); w.classList.add('typing'); setBusy(true);\n  try {\n    const d = (dashOn && !follow) ? await call({ action: 'dashask', question: q, history: chatHist.slice(-4) }, 90000)\n      : (attached && !follow) ? await call({ action: 'docask', question: q, doc: attached.text, fname: attached.name, history: chatHist.slice(-6) }, 90000)\n      : await call({ action: 'ask', question: q, history: chatHist.slice(-6), follow: follow ? 1 : 0 });\n    if (d.error === 'SESSION') { signOut(d.message); return; }\n    const ans = d.answer || d.message || 'No answer.';\n    if (d.mode !== 'chat') { fmt(w, ans); dataNote(w, d); addFb(w, 'child', '', ''); if (d.options || d.choices) showOpts(d); }   // anything that is not a general chat answer (child data, CVC lists, errors): never read aloud, rating-only feedback\n    else { fill(w, ans); noteEl(w, AI_NOTE); addSpk(w, ans); addCopy(w); addShare(w); addFb(w, 'chat', shown, ans); if (!/^Sorry/.test(ans)) showFollow(ans); if (autoSpeak || viaMic) speak(ans); }\n    viaMic = false;\n    if (d.mode === 'chat') { chatHist.push({ r: 'user', t: q }, { r: 'model', t: ans }); if (chatHist.length > 12) chatHist.splice(0, chatHist.length - 12); if (d.persist !== false) saveChat(shown, ans); }\n  } catch (err) {\n    console.error(err); w.classList.remove('typing'); w.textContent = NETMSG(err);\n    const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'spk'; rb.textContent = '↻ ព្យាយាមម្តងទៀត / Retry';\n    rb.onclick = () => { const p = w.previousElementSibling; if (p && p.classList.contains('me')) p.remove(); w.remove(); runAsk(q, shown, follow); };\n    w.appendChild(rb);\n  }\n  setBusy(false); $('send').disabled = false; if (!follow) $('q').focus();\n}\n\nconst grow = () => { const q = $('q'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; };\n$('q').addEventListener('input', grow);\n$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('f').requestSubmit(); } });\n$('chips').addEventListener('click', e => {\n  const b = e.target.closest('button'); if (!b) return;\n  if (b.dataset.cal) { openCal(); return; }\n  if (b.dataset.wv) { add('me', 'អំពីអង្គការទស្សនៈពិភពលោក'); wvMenu('សូមជ្រើសរើសសំណួរដែលអ្នកចង់ដឹង៖'); return; }\n  if (b.dataset.cp) { add('me', 'ការការពារកុមារ និង Do & Don’t'); cpMenu('សូមជ្រើសរើសប្រធានបទដែលអ្នកចង់ដឹង៖'); return; }\n  $('q').value = b.dataset.t; grow(); $('q').focus();\n  if (b.dataset.send) $('f').requestSubmit();\n});\n\n/* ---------------- child pills: pick what to see instead of showing everything ---------------- */\nfunction optRow(items, onPick, actions, key) {\n  const old = $('optrow'); if (old) old.remove();\n  const d = document.createElement('div'); d.id = 'optrow'; d.className = 'optrow';\n  items.forEach(it => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.label; b.onclick = () => onPick(it); d.appendChild(b); });\n  (actions || []).forEach(a => {   // Location + RCM Form (Report / Close)\n    const b = document.createElement('button'); b.type = 'button'; b.className = 'act'; b.textContent = a.label;\n    b.onclick = a.url ? () => window.open(a.url, '_blank', 'noopener') : () => openRcm(key, a.rcm);\n    d.appendChild(b);\n  });\n  $('log').appendChild(d); $('log').scrollTop = 1e9;\n}\nconst KID = {};   // child key -> first reply (all sections), so tapping a pill needs no server call\nfunction showOpts(d) {\n  if (d.key && d.sections) KID[d.key] = d;\n  if (d.options && d.options.length) optRow(d.options, it => childAsk(d.key, it.id), d.actions, d.key);\n  else if (d.choices && d.choices.length) optRow(d.choices, it => childAsk(it.key, 'menu'));\n}\n// Opens the dashboard's RCM form for this child, already signed in (one-time link, valid 2 minutes).\nasync function openRcm(key, type) {\n  const w = window.open('', '_blank');   // opened first so phone browsers don't block it\n  try {\n    const d = await call({ action: 'sso', target: 'rcm', key, type });\n    if (d.ok && d.url) { if (w) w.location.href = d.url; else location.href = d.url; return; }\n    throw new Error(d.message || 'failed');\n  } catch (err) { if (w) w.close(); alert('មិនអាចបើកទម្រង់ RCM បានទេ សូមព្យាយាមម្តងទៀត។\\nCannot open the RCM form. Please try again.'); }\n}\nasync function childAsk(key, section) {\n  stopSpeak();\n  const old = $('optrow'); if (old) old.remove();\n  const kid = KID[key];\n  if (kid && kid.sections && kid.sections[section]) {   // instant: already on the phone\n    const m = document.createElement('div'); m.className = 'm bot'; $('log').appendChild(m);\n    fmt(m, kid.sections[section]); showOpts(kid); return;\n  }\n  const w = document.createElement('div'); w.className = 'm bot'; w.textContent = '…';   // no read-aloud button: child details are never spoken\n  $('log').appendChild(w); $('log').scrollTop = 1e9; setBusy(true);\n  try {\n    const d = await call({ action: 'child', key, section });\n    if (d.error === 'SESSION') { signOut(d.message); return; }\n    fmt(w, d.answer || d.message || 'រកមិនឃើញទេ។'); dataNote(w, d);\n    showOpts(d);\n  } catch (err) { console.error(err); w.textContent = NETMSG(err); }\n  setBusy(false);\n}\n\n/* ---------------- About World Vision: fixed questions and answers (no server call, no Gemini quota) ---------------- */\nconst WV_LINK = '\\n\\nព័ត៌មានបន្ថែម / More: [wvi.org](https://www.wvi.org/about-us)';\nconst WV = [\n  { q: '🌟 ចក្ខុវិស័យរបស់ទស្សនៈពិភពលោកជាអ្វី?', a: [\n    '🌟 ចក្ខុវិស័យ (Vision)',\n    '',\n    'សម្រាប់កុមារគ្រប់រូប មានជីវិតដ៏បរិបូរណ៍។',\n    '(Our vision for every child, life in all its fullness.)',\n    '',\n    'ការអធិស្ឋានរបស់យើង៖ សម្រាប់ដួងចិត្តគ្រប់រូប មានឆន្ទៈធ្វើឱ្យវាកើតឡើង។',\n    '',\n    'ចំណុចសំខាន់៖',\n    '• ផ្តោតលើកុមារដែលងាយរងគ្រោះបំផុត ដើម្បីឱ្យពួកគេរួចផុតពីភាពក្រីក្រ និងមានជីវិតដ៏បរិបូរណ៍',\n    '• សេចក្តីប្រាថ្នាសម្រាប់កុមារ៖ មានសុខភាពល្អ ទទួលបានការអប់រំសម្រាប់ជីវិត ទទួលបានការថែរក្សា និងការការពារ ហើយដឹងពីសេចក្តីស្រឡាញ់របស់ព្រះ និងអ្នកជិតខាង',\n    '• ទស្សនៈពិភ  ការឧបត្ថម្ភកុមារ (Child Sponsorship)',\n    '',\n    '• អ្នកឧបត្ថម្ភម្នាក់ភ្ជាប់ជាមួយកុមារម្នាក់ ហើយផ្តល់ជំនួយរៀងរាល់ខែ។ អ្នកឧបត្ថម្ភ និងកុមារអាចទំនាក់ទំនងគ្នាតាមរយៈលិខិត',\n    '• ប្រាក់ឧបត្ថម្ភត្រូវបានប្រមូលរួមជាមួយអ្នកឧបត្ថម្ភផ្សេងទៀតក្នុងសហគមន៍តែមួយ ហើយប្រើសម្រាប់កម្មវិធីអភិវឌ្ឍសហគមន៍ — មិនផ្តល់ជាសាច់ប្រាក់ផ្ទាល់ដល់កុមារ ឬគ្រួសារទេ',\n    '• ការជ្រើសរើសកុមារ — សហគមន៍ជ្រើសរើសកុមារដែលងាយរងគ្រោះបំផុត ហើយបុគ្គលិកផ្ទៀងផ្ទាត់បញ្ជីឈ្មោះ',\n    '• ការចូលរួមជាការស្ម័គ្រចិត្ត — គ្រួសារ និងកុមារសម្រេចចិត្តដោយខ្លួនឯងថាចូលរួមឬអត់ ជាទូទៅមួយគ្រួសារមួយកុមារ',\n    '• កុមារដែលបានចុះឈ្មោះ (RC) ជាតំណាងនៃកុមារទាំងអស់ក្នុងសហគមន៍',\n    '• ផលប្រយោជន៍ដល់សហគមន៍ទាំងមូល — ទស្សនៈពិភពលោកបញ្ជាក់ថា កុមារម្នាក់ដែលទទួលបានការឧបត្ថម្ភ ធ្វើឱ្យកុមារផ្សេងទៀតប្រហែលបួននាក់ទទួលបានផលប្រយោជន៍ផងដែរ'\n  ].join('\\n') + '\\n\\nព័ត៌មានបន្ថែម / More: [wvi.org](https://www.wvi.org/child-sponsorship)' }\n];\nfunction wvMenu(title) {\n  const old = $('wvmenu'); if (old) old.remove();\n  const d = document.createElement('div'); d.id = 'wvmenu'; d.className = 'm bot menu';\n  const h = document.createElement('div'); h.className = 'mh'; h.textContent = title; d.appendChild(h);\n  WV.forEach(it => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.q; b.onclick = () => wvShow(it); d.appendChild(b); });\n  $('log').appendChild(d); $('log').scrollTop = 1e9;\n}\nfunction wvShow(it) {\n  add('me', it.q);\n  const a = add('bot', it.a, true);\n  wvMenu('ចង់ដឹងអ្វីទៀត?');\n  a.scrollIntoView({ block: 'start' });\n}\n\n/* ---------------- Child protection protocol + Do & Don’t (fixed content, no server call) ---------------- */\nconst CP_NOTE = '\\n\\nចំណាំ៖ នេះជាការណែនាំទូទៅសម្រាប់ CVC។ សម្រាប់ករណីជាក់លាក់ សូមទាក់ទងអ្នកគ្រប់គ្រង ADP ឬអ្នកទទួលបន្ទុកការពារកុមារ។';\nconst CP = [\n  { q: '🛡️ តើការការពារកុមារជាអ្វី?', a: [\n    '🛡️ ការការពារកុមារ (Child Protection)',\n    '',\n    'កុមារគ្រប់រូបមានសិទ្ធិរស់នៅដោយសុវត្ថិភាព ឆ្ងាយពីអំពើហិង្សា ការរំលោភបំពាន ការធ្វេសប្រហែស និងការកេងប្រវ័ញ្ច។',\n    '',\n    'ចំណុចសំខាន់៖',\n    '• ការការពារកុមារជាទំនួលខុសត្រូវរបស់មនុស្សគ្រប់រូប — រួមទាំង CVC ផងដែរ',\n    '• ទស្សនៈពិភពលោកមិនអត់ឱនចំពោះការរំលោភបំពានកុមារឡើយ (Zero tolerance)',\n    '• ផលប្រយោជន៍ល្អបំផុតរបស់កុមារ ត្រូវមកមុនជានិច្ច',\n    '• CVC ជាភ្នែក និងត្រចៀករបស់សហគមន៍ — តួនាទីគឺ សង្កេត ស្តាប់ និងរាយការណ៍ មិនមែនស៊ើបអង្កេតទេ',\n    '• កុមារគ្រប់រូបត្រូវទទួលការគោរពស្មើគ្នា ដោយមិនប្រកាន់ភេទ សាសនា ជាតិសាសន៍ ពិការភាព ឬស្ថានភាពគ្រួសារ'\n  ].join('\\n') + CP_NOTE },\n  { q: '⚠️ ប្រភេទនៃការរំលោភបំពាន និងសញ្ញាព្រមាន', a: [\n    '⚠️ ប្រភេទនៃការរំលោភបំពាន',\n    '',\n    '• រាងកាយ — ទះ វាយ ដុត ធ្វើទារុណកម្ម',\n    '• ផ្លូវចិត្ត — ជេរ ប្រមាថ គំរាម ធ្វើឱ្យអាម៉ាស់ ឬមិនអើពើ',\n    '• ផ្លូវភេទ — ប៉ះពាល់ ឬនិយាយអំពីផ្លូវភេទមិនសមរម្យ ថតរូបអសីលធម៌',\n    '• ការធ្វេសប្រហែស — មិនផ្តល់អាហារ សុខភាព ការអប់រំ និងការមើលថែ',\n    '• ការកេងប្រវ័ញ្ច — ពលកម្មកុមារ ការជួញដូរ ចំណាកស្រុកមិនសុវត្ថិភាព អាពាហ៍ពិពាហ៍ក្មេងជាង១៨ឆ្នាំ',\n    '',\n    '🔎 សញ្ញាព្រមាន',\n    '',\n    '• មានស្នាមជាំ ឬរបួសដែលពន្យល់មិនបាន',\n    '• ភ័យខ្លាច ស្ងាត់ស្ងៀម ឆាប់ខឹង ឬអាកប្បកិរិយាប្រែប្រួលភ្លាមៗ',\n    '• ឈប់រៀន ឬអវត្តមានញឹកញាប់ដោយគ្មានមូលហេតុ',\n    '• ខ្លាចត្រឡប់ទៅផ្ទះ ឬខ្លាចមនុស្សពេញវ័យម្នាក់',\n    '• មើលទៅមិនត្រូវបានថែរក្សា — ស្គម កខ្វក់ ឈឺមិនបានព្យាបាល',\n    '• ត្រូវបានបញ្ជូនទៅធ្វើការ ឬរៀបការទាំងវ័យក្មេង',\n    '',\n    'សញ្ញាមួយមិនមែនជាភស្តុតាងទេ ប៉ុន្តែជាហេតុផលគ្រប់គ្រាន់ដើម្បីរាយការណ៍។'\n  ].join('\\n') + CP_NOTE },\n  { q: '🚨 ពិធីសារ៖ ពេលសង្ស័យ ឬឃើញការរំលោភបំពាន', a: [\n    '🚨 ពិធីសារការពារកុមារ (Protocol)',\n    '',\n    '១. ធានាសុវត្ថិភាពកុមារមុន — បើមានគ្រោះថ្នាក់ភ្លាមៗ សូមហៅអាជ្ញាធរ ឬប៉ូលិស (1288)',\n    '២. ស្តាប់ដោយស្ងប់ស្ងាត់ — ជឿកុមារ កុំសួរសំណួរនាំ កុំបន្ទោស',\n    '៣. កុំស៊ើបអង្កេតខ្លួនឯង ហើយកុំប្រឈមមុខជាមួយអ្នកសង្ស័យ',\n    '៤. កុំសន្យារក្សាសម្ងាត់ទាំងស្រុង — ប្រាប់កុមារថា អ្នកត្រូវប្រាប់អ្នកដែលអាចជួយគាត់បាន',\n    '៥. កត់ត្រាតាមការពិត — ថ្ងៃ ម៉ោង កន្លែង និងពាក្យរបស់កុមារ (មិនបន្ថែមការស្មាន)',\n    '៦. រាយការណ៍ភ្លាមៗ មិនឱ្យលើសពី ២៤ ម៉ោង',\n    '៧. រក្សាការសម្ងាត់ — ប្រាប់តែអ្នកដែលត្រូវដឹង កុំនិយាយក្នុងសហគមន៍ ឬបណ្តាញសង្គម',\n    '',\n    '📶 ថ្នាក់នៃការរាយការណ៍',\n    '',\n    '• ថ្នាក់សហគមន៍ (CVC) — ប្រាប់អ្នកទទួលបន្ទុកការពារកុមារ ឬបុគ្គលិក ADP របស់ទស្សនៈពិភពលោកភ្លាមៗ',\n    '• ថ្នាក់ ADP — អ្នកគ្រប់គ្រង ADP ដំណើរការតាមនីតិវិធីអង្គការ ហើយជូនដំណឹងទៅការិយាល័យជាតិ',\n    '• ថ្នាក់អាជ្ញាធរ — គណៈកម្មាធិការទទួលបន្ទុកកិច្ចការស្ត្រី និងកុមារឃុំ/សង្កាត់ (គ.ក.ស.ក.) អាជ្ញាធរមូលដ្ឋាន ប៉ូលិស និងមន្ទីរសង្គមកិច្ច ដោយមានបុគ្គលិកទស្សនៈពិភពលោកដឹកនាំ',\n    '',\n    '📞 លេខទូរស័ព្ទបន្ទាន់',\n    '',\n    '• ខ្សែទូរស័ព្ទកុមារកម្ពុជា (Child Helpline) — 1280 ឥតគិតថ្លៃ ២៤ ម៉ោង',\n    '• ប៉ូលិសជាតិ — 1288',\n    '',\n    'ប្រសិនបើអ្នកសង្ស័យជាបុគ្គលិក ឬអ្នកស្ម័គ្រចិត្តរបស់ទស្សនៈពិភពលោកផ្ទាល់ ក៏ត្រូវរាយការណ៍ភ្លាមៗដែរ តាមបណ្តាញរាយការណ៍របស់អង្គការ។'\n  ].join('\\n') + CP_NOTE },\n  { q: '✅❌ Do & Don’t — ការប្រព្រឹត្តចំពោះកុមារ', a: [\n    '✅❌ Do & Don’t — ការប្រព្រឹត្តចំពោះកុមារ',\n    '',\n    '✅ ត្រូវធ្វើ (DO)',\n    '• និយាយដោយគោរព សុភាព និងលើកទឹកចិត្ត',\n    '• ធ្វើការជាមួយកុមារក្នុងកន្លែងបើកចំហ ដែលអ្នកផ្សេងមើលឃើញ',\n    '• មានមនុស្សពេញវ័យម្នាក់ទៀតនៅជាមួយ ពេលជួបកុមារ',\n    '• ស្តាប់កុមារ ហើយយកចិត្តទុកដាក់ចំពោះអ្វីដែលគេនិយាយ',\n    '• ប្រើវិន័យវិជ្ជមាន (ពន្យល់ លើកទឹកចិត្ត) ជំនួសការដាក់ទណ្ឌកម្ម',\n    '• ចាត់ទុកកុមារគ្រប់រូបស្មើគ្នា និងលើកទឹកចិត្តឱ្យចូលរួមតាមវ័យ',\n    '• ធ្វើជាគំរូល្អ ទាំងពាក្យសម្តី និងអាកប្បកិរិយា',\n    '',\n    '❌ មិនត្រូវធ្វើ (DON’T)',\n    '• មិនវាយ មិនបង្ខំ មិនជេរ មិនប្រមាថ ឬធ្វើឱ្យកុមារអាម៉ាស់',\n    '• មិនទៅតែពីរនាក់ជាមួយកុមារ ក្នុងកន្លែងបិទជិត ឬឯកជន',\n    '• មិនប៉ះពាល់រាងកាយមិនសមរម្យ ឬនិយាយលេងអំពីផ្លូវភេទ',\n    '• មិនផ្តល់លុយ អំណោយ ឬអត្ថប្រយោជន៍ពិសេសដល់កុមារម្នាក់ ដើម្បីទទួលបានអ្វីមកវិញ',\n    '• មិនបង្ខំកុមារឱ្យធ្វើការគ្រោះថ្នាក់ ឬរំខានដល់ការសិក្សា',\n    '• មិនបង្ហាញការពេញចិត្តកុមារម្នាក់ជាងកុមារផ្សេង ឬរើសអើងកុមារ',\n    '• មិនមើលរំលង ឬបិទបាំងករណីសង្ស័យ'\n  ].join('\\n') + CP_NOTE },\n  { q: '🏠 Do & Don’t — ពេលចុះសួរសុខទុក្ខ និងសកម្មភាពសហគមន៍', a: [\n    '🏠 Do & Don’t — ចុះសួរសុខទុក្ខ និងសកម្មភាពសហគមន៍',\n    '',\n    '✅ ត្រូវធ្វើ (DO)',\n    '• ជូនដ     if (!PUSH_OK) { toast('ឧបករណ៍នេះមិនគាំទ្រការជូនដំណឹង · This device does not support alerts'); return; }
    var t = null; try { t = sessionStorage.getItem('cvc_t'); } catch(e){}
    if (!t) { toast('កំពុងចូលជំនួយការ… សូមព្យាយាមម្តងទៀត · Chatbot is still signing in, try again in a moment'); return; }
    Notification.requestPermission().then(function(perm){
      if (perm !== 'granted') { toast('មិនបានអនុញ្ញាត · Allow notifications in the browser settings'); return; }
      return swReady().then(function(reg){ return reg.pushManager.getSubscription().then(function(sub){ return sub || reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64(VAPID) }); }); })
        .then(function(sub){ return call({ action:'subscribe', sub: sub.toJSON(), token: t }); })
        .then(function(d){ if (!d || !d.ok) throw new Error((d && d.message) || 'save failed'); toast('🔔 បានបើកការជូនដំណឹង · RC date alerts are on'); bellState(); });
    }).catch(function(e){ toast('មិនអាចបើកបាន · Could not turn on alerts (' + (e && e.message || e) + ')'); });
  }
  function alertsOff(){
    var t = null; try { t = sessionStorage.getItem('cvc_t'); } catch(e){}
    swReady().then(function(r){ return r.pushManager.getSubscription(); }).then(function(sub){
      if (sub) { var end = sub.endpoint; return sub.unsubscribe().then(function(){ if (t) call({ action:'unsubscribe', endpoint:end, token:t }).catch(function(){}); }); }
    }).then(function(){ toast('🔕 បានបិទការជូនដំណឹង · Alerts are off'); bellState(); }).catch(function(){});
  }
  bell.addEventListener('click', function(){ if (bell.dataset.on) alertsOff(); else alertsOn(); });
  bellState();
  var fabAv = document.createElement('div'); fabAv.className = 'cva-av'; fabAv.innerHTML = ROBOT('cvaf_'); fab.appendChild(fabAv);
  fab.setAttribute('aria-label', TITLE); box.setAttribute('aria-label', TITLE);
  $('cva-close').textContent = BACK; $('cva-close').setAttribute('aria-label', BACK);

  /* ---- the chatbot (iframe) ---- */
  function mkFrame(){
    if (ifr) return;
    var html = '';
    try { html = JSON.parse($('cva-src').textContent); } catch(e){ console.error(e); return; }
    ifr = document.createElement('iframe'); ifr.id = 'cva-frame'; ifr.title = TITLE;
    ifr.setAttribute('allow', 'microphone; clipboard-write; camera');
    ifr.srcdoc = html; wrap.appendChild(ifr);
  }
  function dropFrame(){ if (ifr) { ifr.remove(); ifr = null; } }
  function inner(fn){ try { return ifr && ifr.contentWindow ? fn(ifr.contentWindow) : undefined; } catch(e){} }

  /* ---- sign-in is shared: same sessionStorage keys the chatbot itself uses ---- */
  function call(body, ms){
    var ac = new AbortController(), tm = setTimeout(function(){ ac.abort(); }, ms || 30000);
    return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body), signal: ac.signal })
      .then(function(r){ return r.text(); })
      .then(function(t){ try { return JSON.parse(t); } catch(e){ throw new Error('BAD_RESPONSE'); } })
      .finally(function(){ clearTimeout(tm); });
  }
  function wipeChats(except){ try { Object.keys(localStorage).filter(function(k){ return k.indexOf('cvc_chat_') === 0 && k !== except; }).forEach(function(k){ localStorage.removeItem(k); }); } catch(e){} }
  // Reuse the sign-in the CVC just typed on the RC login screen (never stored; used once to get a session)
  function loginBot(u, p){
    u = String(u||'').trim(); if (!u || !p) return;
    var mm = u.match(/\(([^)]+)\)\s*$/); if (mm && mm[1].trim()) u = mm[1].trim();   // "Display Name (username)" picked from the list -> username
    call({ action:'login', username:u, password:p, token:null }).then(function(d){
      if (!d || !d.ok) { setWhy('⚠ Chatbot sign-in: ' + ((d && d.message) || 'rejected')); return; }
      setWhy('✓ ចូលដោយស្វ័យប្រវត្តិ / Auto sign-in');
      try { sessionStorage.setItem('cvc_t', d.token); sessionStorage.setItem('cvc_u', u.toLowerCase()); sessionStorage.setItem('cvc_r', d.role || ''); sessionStorage.setItem('cvc_d', d.dash ? '1' : ''); } catch(e){}
      wipeChats('cvc_chat_' + u.toLowerCase()); stash();
      dropFrame(); if (opened) mkFrame();   // a copy opened too early reloads with the new session
    }).catch(function(e){ setWhy('⚠ Chatbot sign-in: ' + (navigator.onLine ? 'no connection to server' : 'offline')); });
  }
  // Reuse the sign-in typed on the RC login screen (never stored; used once to get a session)
  function capture(){
    var u = ($('rc-login-user') || {}).value, p = ($('rc-login-pass') || {}).value;
    if (!u || !p) return; loginBot(u, p);
  }
  // Called by RC Monitoring after ANY successful login (typed, SSO, hand-off, restored session): one sign-in for both
  window.__cvaAuto = function(u, p){
    try { if (sessionStorage.getItem('cvc_t') || !u || !p) return; localStorage.setItem('rc_cva_user', String(u)); } catch(e){}
    loginBot(u, p);
  };
  function signOut(){
    var t = null; try { t = sessionStorage.getItem('cvc_t'); } catch(e){}
    var done = false;
    if (ifr) { done = !!inner(function(w){ if (typeof w.signOut === 'function') { w.signOut(); return true; } }); }   // the chatbot signs itself out (server logout, clears chats)
    if (!done && t) call({ action:'logout', token:t }).catch(function(){});
    forget();
    wipeChats(); dropFrame(); if (opened) close();
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest && e.target.closest('#rc-login-btn'); if (t) capture();
    var o = e.target.closest && e.target.closest('[data-act="logout"]'); if (o) signOut();
  }, true);
  document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target && e.target.id === 'rc-login-pass') capture(); }, true);

  /* ---- open / close ---- */
  function open(){
    opened = true; if (!restore() && !$('cva-why').textContent) setWhy('ចូលម្តង / Sign in once here, it will be remembered');
    mkFrame(); box.classList.add('on'); document.documentElement.style.overflow = 'hidden';
    inner(function(w){ if (typeof w.setTheme === 'function') w.setTheme(localStorage.getItem('cvc_theme') || 'auto'); });
    sync();
  }
  function close(){ opened = false; box.classList.remove('on'); document.documentElement.style.overflow = ''; sync(); if (!fab.hidden) fab.focus(); }
  fab.onclick = open; $('cva-close').onclick = close;
  box.addEventListener('click', function(e){ if (e.target === box) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && opened) close(); });
  window.addEventListener('message', function(e){ if (ifr && e.source === ifr.contentWindow && e.data && e.data.type === 'cva-close') close(); });

  /* the button shows only after sign-in to RC Monitoring (the app re-renders, so watch it) */
  var raf = 0;
  function sync(){
    raf = 0; var inApp = !!document.querySelector('#rc-app .rc-hero');
    fab.hidden = !inApp || opened; bell.hidden = !inApp || opened || !PUSH_OK;
    if (inApp && !ifr) restore();
    if (!inApp && opened) close();
    if (wasIn && !inApp) signOut();   // RC Monitoring signed out by itself (e.g. time-out): end the chatbot session too
    wasIn = inApp;
  }
  var app = $('rc-app');
  if (app) new MutationObserver(function(){ if (!raf) raf = requestAnimationFrame(sync); }).observe(app, { childList:true, subtree:true });
  sync();
})();
</script>
