        '<div class="rc-child-name">'+escapeHtml(c.name)+
          (sum.issues>0?'<span class="rc-tag bad">⚠️ '+sum.issues+' បញ្ហា</span>':'<span class="rc-tag ok">✓ ល្អ</span>')+
        '</div>'+
        '<div class="rc-child-meta">'+escapeHtml(c.gender||'')+' · '+escapeHtml(c.age||'-')+'ឆ្នាំ'+(c.overdue!=null?' · '+c.overdue+'ថ្ងៃ':'')+'</div>'+
        '<div class="rc-child-meta">🆔 '+escapeHtml(c.code||'-')+(c.rcStatus?' · '+escapeHtml(c.rcStatus):'')+'</div>';
      if(sum.issues>0) html+='<div class="rc-last" style="color:var(--clay);">'+escapeHtml(sum.labels.join(' · '))+'</div>';
      if(state.childSaved[c.code]) html+='<div class="rc-last" style="color:var(--ok-fg);">✓ បានរក្សាទុក</div>';
      html+='</div>';
      html+='<span class="rc-pick-arrow2">›</span>';
      html+='</button>';
    });

    if(kids.length>0){
      html+='<div class="rc-sticky-submit">'+
        '<div class="rc-sticky-text"><b>'+savedCount+'</b>/'+kids.length+' · <b style="color:'+(anyIssues>0?'var(--clay)':'var(--ok-fg)')+'">'+anyIssues+' បញ្ហា</b></div>'+

        '</button>'+
      '</div>';
    }
    html+='</div>';
    return html;
  }

  /* ── MODAL ───────────────────────────────────────────────────────── */
  function renderModal(childCode){
    var c=DB.children.filter(function(x){return x.code===childCode;})[0];
    if(!c)return '';
    var st=state.childStatus[c.code]||defaultStatus();
    var html='<div class="rc-overlay" data-act="overlay"><div class="rc-modal" data-stop="1">';
    html+='<div class="rc-modal-head">';
    if(c.photo) html+='<img class="rc-modal-avatar" src="'+escapeHtml(c.photo)+'" onerror="this.style.display=\'none\'">';
    else html+='<div class="rc-avatar rc-modal-avatar" style="width:52px;height:52px;font-size:18px;">'+escapeHtml(initials(c.name))+'</div>';
    html+='<div><div class="rc-modal-h">'+escapeHtml(c.name)+'</div><div class="rc-modal-sub">'+escapeHtml(c.gender||'')+' · '+escapeHtml(c.age||'-')+'ឆ្នាំ · '+escapeHtml((villageByCode[c.villageCode]||{}).name||'')+'</div><div class="rc-modal-sub">🆔 '+escapeHtml(c.code||'-')+(c.rcStatus?' · '+escapeHtml(c.rcStatus):'')+'</div></div>';

        '<div class="rc-criterion-top">'+
          '<span class="rc-criterion-label"><span class="crit-chip">'+crit.icon+'</span>'+escapeHtml(crit.label)+'</span>'+
          '<div class="rc-toggle-pair">'+
            '<button type="button" class="rc-toggle-btn yes'+(!isNo?' is-on':'')+'" data-toggle="'+crit.key+'" data-val="Yes">មាន ✓</button>'+
            '<button type="button" class="rc-toggle-btn no'+(isNo?' is-on':'')+'" data-toggle="'+crit.key+'" data-val="No">គ្មាន ✗</button>'+
          '</div>'+
        '</div>';
      if(isNo){
        html+='<div class="rc-criterion-reason"><label>⚠️ មូលហេតុ</label><textarea data-reason="'+crit.key+'" placeholder="សរសេរមូលហេតុ...">'+escapeHtml(f.reason)+'</textarea></div>';
      }
      html+='</div>';
    });
    html+='<div class="rc-modal-actions">'+
      '<button type="button" class="rc-btn-primary" data-act="closeModal" data-c="'+escapeHtml(c.code)+'">'+
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'+
        'បានរួចរាល់ · រក្សាទុក'+
      '</button>'+
    '</div>';
    html+='</div></div>';
    return html;
  }

  /* ── ADMIN VIEW ──────────────────────────────────────────────────── */
  var adminCache=null;
  function loadAdminData(){
    state.busy=true;render();
    try{
      var items=[];
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);if(!k)continue;
        if(k.indexOf('lastmap_')===0){try{var map=JSON.parse(localStorage.getItem(k)||'{}');Object.values(map).forEach(function(r){if(r&&r.childCode)items.push(r);});}catch(e){}}
      }
      adminCache=items.sort(function(a,b){return(b.submittedAt||'').localeCompare(a.submittedAt||'');});
    }catch(e){adminCache=[];}
    state.busy=false;render();
  }

  function renderAdminView(){
    var html='<div class="rc-card">';
    html+='<div class="rc-admin-bar">'+
      '<div><div class="rc-section-title" style="margin-bottom:2px;">📊 ទិន្នន័យតាមដានសរុប</div><div class="rc-section-sub" style="margin-bottom:0;">កំណត់ត្រាទាំងអស់</div></div>'+
      '<div style="display:flex;gap:8px;">'+
        '<button type="button" class="rc-export-btn" data-act="refreshSheetData"'+(state.dataLoading?' disabled':'')+'>'+(state.dataLoading?'<span class="rc-spin"></span>':'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.86"/></svg>')+' ទាញយកឡើងវិញ</button>'+
        '<button type="button" class="rc-export-btn" data-act="exportXlsx"'+(state.xlsxBusy?' disabled':'')+'>'+(state.xlsxBusy?'<span class="rc-spin"></span>':'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>')+' Excel</button>'+
      '</div>'+
    '</div>';
    if(state.busy){html+='<div class="rc-loading"><span class="rc-spin"></span> ...</div></div>';return html;}
    var items=adminCache||[];
    var uniqueChildren={};items.forEach(function(i){uniqueChildren[i.childCode]=1;});
    var issueCount=0;items.forEach(function(i){CRITERIA.forEach(function(c){if(i[c.key]==='No')issueCount++;});});
    html+='<div class="rc-stat-row">'+
      '<div class="rc-stat"><b>'+items.length+'</b><span>កំណត់ត្រា</span></div>'+
      '<div class="rc-stat"><b>'+Object.keys(uniqueChildren).length+'</b><span>កុមារ</span></div>'+
      '<div class="rc-stat"><b>'+issueCount+'</b><span>បញ្ហា</span></div>'+
      '<div class="rc-stat"><b>'+DB.children.length+'</b><span>កុមារសរុប</span></div>'+
    '</div>';
    if(items.length===0){html+='<div class="rc-empty">មិនទាន់មានកំណត់ត្រា</div></div>';return html;}
    html+='<div class="rc-table-wrap"><table class="rc-table"><thead><tr>'+
      '<th>ថ្ងៃ</th><th>ភូមិ</th><th>ស្ម័គ្រចិត្ត</th><th>កុមារ</th><th>ប្រធានបទ</th>'+
      '<th>📅</th><th>🌿</th><th>📖</th><th>🛡️</th><th>🤝</th><th>មូលហេតុ</th>'+
    '</tr></thead><tbody>';
    items.forEach(function(i){
      var reasons=[];CRITERIA.forEach(function(c){if(i[c.key]==='No'&&i[c.key+'Reason'])reasons.push(c.label+': '+i[c.key+'Reason']);});
      html+='<tr><td>'+fmtDate(i.date)+'</td><td>'+escapeHtml(i.villageName)+'</td><td>'+escapeHtml(i.volunteerName)+'</td>'+
        '<td>'+escapeHtml(i.childName)+'</td><td>'+escapeHtml((i.topics||[]).join('; '))+'</td>'+
        '<td>'+escapeHtml(i.attendance)+'</td><td>'+escapeHtml(i.health)+'</td><td>'+escapeHtml(i.education)+'</td>'+
        '<td>'+escapeHtml(i.protection)+'</td><td>'+escapeHtml(i.participation)+'</td>'+
        '<td>'+escapeHtml(reasons.join(' | '))+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
    return html;
  }

  /* ── SETTINGS — collapsible sections ─────────────────────────────────
     Settings has grown into several blocks (Users, Village→CVC, per-child
     CVC, RC with no CVC). Each block header is clickable so an admin can
     hide the ones they don't need right now and just see what they came
     for — e.g. hide "Users" while doing CVC assignment. This is a purely
     personal display preference (kept in this browser only, like
     pref_last_selection), so it does NOT sync to the shared Firestore data
     and doesn't affect what anyone else sees.                             */
  var SETTINGS_HIDDEN_KEY='rc_settings_hidden_v1';
  function loadSettingsHiddenPref(){
    try{var v=localStorage.getItem(SETTINGS_HIDDEN_KEY);if(v)state.settingsHidden=JSON.parse(v)||{};}catch(e){}
  }
  function saveSettingsHiddenPref(){
    try{localStorage.setItem(SETTINGS_HIDDEN_KEY,JSON.stringify(state.settingsHidden||{}));}catch(e){}
  }
  function toggleSettingsSection(key){
    state.settingsHidden[key]=!state.settingsHidden[key];
    saveSettingsHiddenPref(); render();
  }
  // Wraps a block's body in the standard .rc-settings-block shell with a
  // clickable header — tap anywhere on the header (or the pill on the
  // right) to hide/show that section's body. countLabel is an optional
  // small badge (e.g. "3 users") shown next to the title even while
  // collapsed, so an admin can tell at a glance what's tucked away.
  function settingsBlock(key,titleHtml,countLabel,bodyHtml){
    var hidden=!!state.settingsHidden[key];
    var html='<div class="rc-settings-block">';
    html+='<div class="rc-settings-block-head" data-act="toggleSettingsSection" data-section="'+key+'">'+
      '<h3 style="margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+titleHtml+
        (countLabel?('<span class="rc-badge">'+escapeHtml(countLabel)+'</span>'):'')+
      '</h3>'+
      '<span class="rc-mini-btn ghost rc-settings-toggle-btn" type="button">'+(hidden?'👁️ បង្ហាញ · Show':'🙈 លាក់ · Hide')+'</span>'+
    '</div>';
    if(!hidden) html+='<div class="rc-settings-block-body">'+bodyHtml+'</div>';
    html+='</div>';
    return html;
  }

  /* ── SETTINGS VIEW ───────────────────────────────────────────────────
     Merges what used to be two separate systems — login (Users/PIN) and
     the Village → CVC Assignment tool — into this one admin-only screen,
     plus a "no CVC" panel so any RC missing a CVC is visible and fixable
     right here instead of only inside the Dashboard. */
  function renderSettingsView(){
    if(state.role!=='admin'){
      return '<div class="rc-card"><div class="rc-empty">សម្រាប់តែអ្នកគ្រប់គ្រងប៉ុណ្ណោះ · Admins only</div></div>';
    }
    var html='<div class="rc-card">';
    html+='<div class="rc-admin-bar">'+
      '<div><div class="rc-section-title" style="margin-bottom:2px;">⚙️ ការកំណត់</div>'+
      '<div class="rc-section-sub" style="margin-bottom:0;">អ្នកប្រើប្រាស់ (ចូលប្រើប្រាស់) និងការចាត់តាំង CVC នៅកន្លែងតែមួយ<br>Users (login) and CVC Assignment together in one place</div></div>'+
      '<button type="button" class="rc-export-btn" data-act="refreshSheetData"'+(state.dataLoading?' disabled':'')+'>'+(state.dataLoading?'<span class="rc-spin"></span>':'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.86"/></svg>')+' ទាញយកឡើងវិញ</button>'+
    '</div>';

    // Known real names — pulled from the same CVC identities already on file
    // (Village → CVC Assignment + per-child overrides) — used to make the
    // Username field below a searchable picker instead of free-typing, so
    // logins line up with the exact real name used for CVC assignment.
    var cvcNames=allKnownCvcNamesMonitor();
    var namesDatalist='<datalist id="rcKnownCvcNames">'+cvcNames.map(function(c){return '<option value="'+escapeHtml(c)+'">';}).join('')+'</datalist>';

    /* ── Users (login) ─────────────────────────────── */
    var userRows=(USERS||[]).map(function(u){
      var confirming=SETTINGS_USER_DELETE_CONFIRM===u.id;
      return '<tr>'+
        '<td><input type="text" class="rc-mini-input" list="rcKnownCvcNames" data-user-field="username" data-user-id="'+escapeHtml(u.id)+'" value="'+escapeHtml(u.username)+'" style="min-width:130px;"/></td>'+
        '<td><div class="rc-mini-row" style="margin:0;gap:4px;flex-wrap:nowrap;">'+
          '<input type="text" class="rc-mini-input" data-user-field="pin" data-user-id="'+escapeHtml(u.id)+'" value="'+escapeHtml(u.pin)+'" style="max-width:70px;"/>'+
          '<button type="button" class="rc-mini-btn ghost" data-act="settingsGenPinRow" data-id="'+escapeHtml(u.id)+'" title="បំពេញ PIN ស្វ័យប្រវត្តិ · Auto-complete PIN">🎲</button>'+
        '</div></td>'+
        '<td><input type="text" class="rc-mini-input" data-user-field="displayName" data-user-id="'+escapeHtml(u.id)+'" value="'+escapeHtml(u.displayName||'')+'" style="min-width:120px;"/></td>'+
        '<td><select class="rc-mini-select" data-user-field="role" data-user-id="'+escapeHtml(u.id)+'">'+
          '<option value="admin"'+(u.role==='admin'?' selected':'')+'>Admin</option>'+
          '<option value="teamleader"'+(u.role==='teamleader'?' selected':'')+'>Team Leader</option>'+
          '<option value="cvc"'+(u.role==='cvc'?' selected':'')+'>CVC</option>'+
        '</select></td>'+
        '<td><button type="button" class="rc-mini-btn '+(confirming?'danger':'ghost')+'" data-act="settingsDeleteUser" data-id="'+escapeHtml(u.id)+'">'+(confirming?'ចុចម្តងទៀត · Confirm':'លុប · Delete')+'</button></td>'+
      '</tr>';
    }).join('');

    html+=settingsBlock('users','👤 អ្នកប្រើប្រាស់ · Users (login — shared with the MBR2 Dashboard)',(USERS||[]).length+' users',
      '<div class="rc-settings-help">ប្រើឈ្មោះពិតរបស់ CVC/បុគ្គលិកជា ឈ្មោះអ្នកប្រើ (វាយបញ្ចូល ឬជ្រើសរើសពីបញ្ជីស្វែងរក) ដើម្បីឲ្យត្រូវគ្នានឹងឈ្មោះនៅក្នុងតារាងចាត់តាំង CVC ខាងក្រោម។ PIN អាចទុកទទេ ហើយចុច 🎲 ដើម្បីបំពេញដោយស្វ័យប្រវត្តិ។<br/>Use the CVC/staff member\'s real name as the username (type it or pick it from the searchable list) so it matches the name used in the CVC Assignment table below. Leave PIN blank and tap 🎲 to auto-complete it.</div>'+
      '<div class="rc-table-wrap"><table class="rc-table"><thead><tr><th>ឈ្មោះពិត · Real Name (Username)</th><th>PIN</th><th>ឈ្មោះបង្ហាញ · Display Name</th><th>តួនាទី · Role</th><th></th></tr></thead>'+
      '<tbody>'+(userRows||'<tr><td colspan="5" class="rc-empty" style="padding:14px;">មិនទាន់មានអ្នកប្រើទេ</td></tr>')+'</tbody></table></div>'+
      '<div class="rc-mini-row">'+
        '<input type="text" class="rc-mini-input" id="rc-newUserName" list="rcKnownCvcNames" placeholder="ឈ្មោះពិត (ស្វែងរក) · Real name (searchable)" style="min-width:190px;"/>'+
        '<div class="rc-mini-row" style="margin:0;gap:4px;flex-wrap:nowrap;">'+
          '<input type="text" class="rc-mini-input" id="rc-newUserPin" placeholder="PIN (ស្វ័យប្រវត្តិ)" style="max-width:120px;"/>'+
          '<button type="button" class="rc-mini-btn ghost" id="rc-newUserPinGen" title="បំពេញ PIN ស្វ័យប្រវត្តិ · Auto-complete PIN">🎲</button>'+
        '</div>'+
        '<input type="text" class="rc-mini-input" id="rc-newUserDisplay" placeholder="ឈ្មោះបង្ហាញ (ស្រេចចិត្ត) · Display Name (optional)"/>'+
        '<select class="rc-mini-select" id="rc-newUserRole">'+
          '<option value="cvc">CVC</option><option value="teamleader">Team Leader</option><option value="admin">Admin</option>'+
        '</select>'+
        '<button type="button" class="rc-mini-btn" data-act="settingsAddUser">+ បន្ថែម · Add User</button>'+
      '</div>'+
      '<div class="rc-mini-row"><button type="button" class="rc-mini-btn ghost" data-act="settingsSaveUsers">💾 រក្សាទុកអ្នកប្រើប្រាស់ · Save Users</button></div>'
    );

    /* ── Village → CVC Assignment ─────────────────────── */
    var cvcEntries=Object.keys(CVCMAP||{}).sort(function(a,b){return a.localeCompare(b);});
    var cvcRows=cvcEntries.map(function(village){
      return '<tr><td>'+escapeHtml(village)+'</td><td>'+escapeHtml(CVCMAP[village])+'</td>'+
        '<td><button type="button" class="rc-mini-btn ghost" data-act="settingsDeleteCvcMap" data-village="'+escapeHtml(village)+'">លុប · Delete</button></td></tr>';
    }).join('');

    html+=settingsBlock('villageCvc','🧭 ភូមិ → ការចាត់តាំង CVC · Village → CVC Assignment',cvcEntries.length+' villages',
      '<div class="rc-settings-help">កំណត់ថាភូមិនីមួយៗស្ថិតនៅក្រោមការទទួលខុសត្រូវរបស់ CVC ណា — ដូចគ្នាទៅនឹងតារាងនៅក្នុងផ្ទាំងគ្រប់គ្រង MBR2។<br/>Same table as the MBR2 Dashboard\'s Settings — assign each village to the CVC responsible for it.</div>'+
      '<div class="rc-table-wrap"><table class="rc-table"><thead><tr><th>ភូមិ · Village</th><th>CVC</th><th></th></tr></thead>'+
      '<tbody>'+(cvcRows||'<tr><td colspan="3" class="rc-empty" style="padding:14px;">មិនទាន់មានការចាត់តាំងទេ</td></tr>')+'</tbody></table></div>'+
      '<div class="rc-mini-row">'+
        '<input type="text" class="rc-mini-input" id="rc-newCvcVillage" placeholder="ឈ្មោះភូមិ · Village name"/>'+
        '<input type="text" class="rc-mini-input" id="rc-newCvcName" list="rcKnownCvcNames" placeholder="ឈ្មោះ CVC · CVC name"/>'+
        '<button type="button" class="rc-mini-btn" data-act="settingsAddCvcMap">+ បន្ថែម · Add</button>'+
      '</div>'+
      '<div class="rc-settings-help" style="margin-top:12px;">ឬបិទភ្ជាប់ជាបញ្ជី (ភូមិ, CVC ក្នុងមួយជួរ) ដើម្បីនាំចូលច្រើនក្នុងពេលតែមួយ៖<br/>Or paste a list (village, CVC per line) to bulk-import:</div>'+
      '<textarea class="rc-mini-textarea" id="rc-cvcMapPaste" placeholder="Village A, CVC Name 1&#10;Village B, CVC Name 2"></textarea>'+
      '<div class="rc-mini-row"><button type="button" class="rc-mini-btn ghost" data-act="settingsImportCvcMap">នាំចូល · Import list</button></div>'+
      namesDatalist
    );

    /* ── Assign CVC per individual child (RC) ────────────────────────
       For villages where RC are spread across different areas and are
       actually closer to (or followed by) different CVCs rather than one
       single CVC for the whole village — e.g. 20 RC in one village might
       split across 2-3 CVCs depending on which part of the village each
       child lives in. Pick a village, then assign each RC in it one at a
       time; anything left unassigned here just falls back to that
       village's default CVC above. */
    var childAssignVillages=DB.villages.slice().sort(function(a,b){return a.name.localeCompare(b.name,'km');});
    var childAssignVillageCode=state.assignChildVillageCode||(childAssignVillages[0]?childAssignVillages[0].code:'');
    var childAssignVillage=villageByCode[childAssignVillageCode];

    var villageKnownCvcs=childAssignVillage?

        '</td>'+
        '<td><div class="rc-mini-row" style="margin:0;flex-wrap:wrap;gap:4px;">'+

    html+=settingsBlock('childCvc','🧒 ចាត់តាំង CVC តាមកុមារនីមួយៗ · Assign CVC per individual child',null,
      '<div class="rc-settings-help">សម្រាប់ភូមិដែលមាន RC ច្រើននាក់ (ឧ. 20 RC) រស់នៅតំបន់ផ្សេងគ្នាក្នុងភូមិតែមួយ ហើយនៅជិត CVC ខុសៗគ្នា — ជ្រើសរើសភូមិខាងក្រោម រួចចាត់តាំង CVC ដល់ RC ម្នាក់ៗដោយឡែក ជំនួសឲ្យការចាត់តាំងភូមិទាំងមូលទៅ CVC តែម្នាក់។ ក្នុងជួរ "ជ្រើសរើស CVC" ខាងក្រោម បង្ហាញតែ CVC ដែលមានស្រាប់ក្នុងភូមិនេះប៉ុណ្ណោះ (មិនមែនគ្រប់ CVC ទាំងអស់ទេ) ដើម្បីងាយស្រួលជ្រើសរើស។ RC ណាដែលមិនបានចាត់តាំងនៅទីនេះ នឹងប្រើ CVC លំនាំដើមរបស់ភូមិ (ខាងលើ) ជំនួសវិញ។<br/>For villages with many RC (e.g. 20) living in different areas, select the village below and assign each RC individually to whichever CVC is nearest to them, instead of sending the whole village to one CVC. The "Select CVC" dropdown below only lists CVCs already in this village (not every CVC everywhere) so it stays quick to pick from. Anything left unassigned here just uses that village\'s default CVC above.</div>'+

    /* ── RC with no CVC assigned yet ─────────────────────── */
    var groups=unassignedVillageGroups();
    var groupsHtml=groups.map(function(g){

      return '<div class="rc-unassigned-card">'+
        '<div><b>'+escapeHtml(g.villageName)+'</b><span class="rc-badge">'+g.kids.length+' RC</span></div>'+
        '<div class="rc-mini-row">'+
          '<select class="rc-mini-select rc-assign-village-select">'+

          '</select>'+

          '<button type="button" class="rc-mini-btn" data-act="settingsAssignVillage" data-village="'+escapeHtml(g.villageName)+'">ចាត់តាំងទាំងអស់ · Assign all '+g.kids.length+'</button>'+

    html+=settingsBlock('noCvc','⚠️ RC គ្មាន CVC · RC with no CVC assigned',groups.length?(groups.length+' villages'):null,
      '<div class="rc-settings-help">ភូមិខាងក្រោមមាន RC ប៉ុន្តែមិនទាន់មាន CVC កំណត់ទេ — ជ្រើសរើស ឬបញ្ចូល CVC ថ្មី ដើម្បីចាត់តាំងភ្លាមៗ។<br/>These villages have RC on file but no CVC assigned yet — pick or type a CVC to assign them right away.</div>'+
      (groupsHtml||'<p class="rc-empty" style="padding:14px 0;">🎉 គ្រប់ RC ទាំងអស់មាន CVC រួចហើយ · Every RC already has a CVC assigned.</p>')
    );

    html+='</div>';
    return html;
  }

  /* ── EXCEL EXPORT — rebuilds the official paper monitoring form
     (បញ្ជីរត្រួតពិនិត្យកុមារទំនុកបំរុងដោយសហគមន៍) as a real .xlsx, laid
     out and styled to match that printed template: title row, four blank
     fill-in header lines (village/commune, activities, inspector), then
     the 17-column data table (one row per visit record) with the same
     column order, widths, green header fill, and borders as the sample. */
  // Village → Commune lookup (Mongkol Borei 2 programme area), sourced from the roster's
  // Commune ID / Village ID sheets. Used to auto-fill យុំៈ on the official form header —
  // village names are the only key this app carries (no separate code system), so this
  // maps name → commune name directly.
  var VILLAGE_COMMUNE_KH = {"ក្រូច":"ស្រះរាំង","ខ្លាខាំឆ្កែ":"តាឡំ","គោកក្តួច":"បន្ទាយនាង","គោកក្រសាំង":"ស្រះរាំង","គោកច្រាប":"ស្រះរាំង","គោកទន្លាប់":"បន្ទាយនាង","គោកព្នៅ":"បន្ទាយនាង","គោកស្រុក":"ស្រះរាំង","ឃីឡិក":"បន្ទាយនាង","ចំការចេក":"ស្រះរាំង","ចុងគោក":"តាឡំ","ដងរុនកើត":"បន្ទាយនាង","ដងរុនលិច":"បន្ទាយនាង","តាចាន់":"ស្រះរាំង","តាឡំកណ្តាល":"តាឡំ","តាឡំចុង":"តាឡំ","តាអ៊ិន១":"ស្រះរាំង","តាអ៊ិន២":"ស្រះរាំង","ត្របែក":"បន្ទាយនាង","ត្រាង":"បន្ទាយនាង","បន្ទាយនាង":"បន្ទាយនាង","បឹងឃ្លាំងកើត":"តាឡំ","បឹងឃ្លាំងលិច":"តាឡំ","បឹងវែង":"តាឡំ","ពង្រ":"បន្ទាយនាង","ព្រះស្រែ":"តាឡំ","ព្រៃចង្ហាកើត":"បន្ទាយនាង","ព្រៃចង្ហាលិច":"បន្ទាយនាង","ភ្នំ":"បន្ទាយនាង","សំរោងពេន":"បន្ទាយនាង","ស្រះរាំង":"ស្រះរាំង","អូរធំ":"បន្ទាយនាង","អូរអណ្តូងកណ្តាល":"បន្ទាយនាង","អូរអណ្តូងកើត":"បន្ទាយនាង","អូរអណ្តូងលិច":"បន្ទាយនាង"};

  var YES_NO_KM = { Yes:'មាន', No:'គ្មាន' };
  function ynKm(v){ return YES_NO_KM[v] || v || ''; }

  // Formats an ISO yyyy-mm-dd date as dd/mm/yyyy for the printed form's ថ្ងៃទីៈ field.
  function xlsxFormDate(iso){
    if(!iso) return '';
    var p=String(iso).split('-');
    if(p.length<3) return iso;
    return p[2]+'/'+p[1]+'/'+p[0];
  }
  // Pulls the header-block fill-ins (ប្រធានបទ topics × 3, and the form date) out of the
  // exported record set itself, instead of leaving them as blank dotted lines: topics are
  // deduped across every record (in order of first appearance) and placed into the three
  // "តាមដានកុមារក្នុងសកម្មភាព / សកម្មភាពទី2 / សកម្មភាពទី3" slots — any slot beyond what the
  // records actually used stays blank. The date only fills in when every record shares the
  // same date; a mixed-date export (e.g. the full admin cache) leaves it blank rather than
  // showing one date that doesn't apply to every row.
  function deriveFormHeaderMeta(items){
    var topics=[];
    (items||[]).forEach(function(i){
      var list=Array.isArray(i.topics)?i.topics:(i.topics?[i.topics]:[]);
      list.forEach(function(t){ if(t && topics.indexOf(t)===-1) topics.push(t); });
    });
    var dates=[];
    (items||[]).forEach(function(i){ if(i.date && dates.indexOf(i.date)===-1) dates.push(i.date); });
    var villages=[];
    (items||[]).forEach(function(i){ if(i.villageName && villages.indexOf(i.villageName)===-1) villages.push(i.villageName); });
    var villageName = villages.length===1 ? villages[0] : '';
    return{
      topic1:topics[0]||'', topic2:topics[1]||'', topic3:topics[2]||'',
      date: dates.length===1 ? xlsxFormDate(dates[0]) : '',
      villageName: villageName,
      communeName: villageName ? (VILLAGE_COMMUNE_KH[villageName]||'') : ''
    };
  }

  async function exportXlsx(){
    if(typeof ExcelJS==='undefined'){ showToast('សូមរង់ចាំ Excel library កំពុងផ្ទុក រួចសាកល្បងម្តងទៀត','true'); return; }
    state.xlsxBusy=true; render();
    try{
      var items=adminCache||[];
      var wb=new ExcelJS.Workbook();
      var ws=wb.addWorksheet('Sheet1');

      // Columns L and M (education-reason pair) are left at Excel's default width in
      // the official sample — not explicitly set — so we skip them here too.
      var COL_WIDTHS=[15.73,8,3.73,8.63,7.73,5,14.63,5.18,8,5.73,6.18,null,null,6.54,6.18,6.63,6.18];
      COL_WIDTHS.forEach(function(w,idx){ if(w!=null) ws.getColumn(idx+1).width=w; });

      var titleFont={ name:'Bokor', size:18 };
      var subFont={ name:'Battambang', size:9 };
      var headerFont={ name:'Battambang', size:8, bold:true };
      var bodyFont={ name:'Battambang', size:8 };
      var greyEdge={ style:'medium', color:{argb:'FFCCCCCC'} };
      var blackEdge={ style:'medium', color:{argb:'FF000000'} };

      function headerLine(rowNum,text,font,height,extraAlign,bottomEdge){
        ws.mergeCells(rowNum,1,rowNum,17);
        var cell=ws.getCell(rowNum,1);
        cell.value=text;
        cell.font=font;
        cell.alignment=Object.assign({ vertical:'middle', wrapText:true },extraAlign||{});
        cell.border={ left:greyEdge, top:greyEdge, bottom:bottomEdge||greyEdge };
        ws.getRow(rowNum).height=height;
      }

      var formMeta=deriveFormHeaderMeta(items);
      headerLine(1,'បញ្ជីរត្រួតពិនិត្យកុមារទំនុកបំរុងដោយសហគមន៍នៃកម្មវិធីតំបន់ស្រុកមង្គលបុរី ២',titleFont,37.5,{horizontal:'center'});
      headerLine(2,'ភូមិៈ '+formMeta.villageName+' ....................................ឃុំៈ '+formMeta.communeName+' .............................................. ស្រុក មង្គលបូរី ខេត្តបន្ទាយមានជ័យ',subFont,19.5);
      headerLine(3,'តាមដានកុមារក្នុងសកម្មភាព៖ '+formMeta.topic1+' ................................................................................................................................................................................',subFont,19.5,{horizontal:'left',wrapText:false});
      headerLine(4,'សកម្មភាពទី2: '+formMeta.topic2+' .............................................................................................................................................................................',subFont,19.5);
      headerLine(5,'សកម្មភាពទី3: '+formMeta.topic3+' .................................................................................................................................................................................',subFont,19.5);
      // Last fill-in line before the data table gets a black bottom edge (not grey) —
      // it's the visible line that opens the table, exactly as in the official sample.
      // តួនាទីៈ is always this app's own role (CVC); ថ្ងៃទីៈ fills in only when every
      // exported record shares one date. Name/signature/phone have no data source here,
      // so those stay as blank dotted lines for hand-completion, same as the original.
      headerLine(6,'ឈ្មោះអ្នកត្រួតពិនិត្យៈ........................................តួនាទីៈ CVC..................................... ហត្ថលេខាៈ................................ លេខទូរស័ព្ទ:.................................. ថ្ងៃទីៈ '+formMeta.date+'.........................',subFont,19.5,null,blackEdge);

      // Table-grid border: every cell's own right+bottom edge carries the black line
      // (this is what actually draws every vertical/horizontal grid line, since it's
      // shared with the neighbouring cell's left/top). Only column A needs its own
      // black left edge, since there's no cell to its left to supply one. Top stays
      // grey throughout — it's redundant once the row above's black bottom is drawn,
      // and matches the sample's XML exactly.
      function tableEdge(colIdx1based){
        return { left:(colIdx1based===1?blackEdge:greyEdge), right:blackEdge, top:greyEdge, bottom:blackEdge };
      }
      // Body rows leave these 3 columns (village code / age / RC status) unfilled —
      // a quirk of the original paper-form template, preserved for an exact match.
      var NO_FILL_COLS={5:true,6:true,7:true};
      var whiteFill={ type:'pattern', pattern:'solid', fgColor:{argb:'FFFFFFFF'} };

      var HEADERS=['លេខកូដកុមារ','\nឈ្មោះកុមារ','ភេទ','ឈ្មោះភូមិ','លេខកូដភូមិ','អាយុ','ស្ថានភាពកុមារក្នុងកម្មវិធីទំនុកបំរុង','វត្តមាន','មូលហេតុ','សុខភាព','មូលហេតុ','ការសិក្សា','មូលហេតុ','ការការពារ','មូលហេតុ','ការចូលរួម','មូលហេតុ'];
      ws.getRow(7).height=34.5;
      HEADERS.forEach(function(h,idx){
        var cell=ws.getCell(7,idx+1);
        cell.value=h;
        cell.font=headerFont;
        cell.alignment={ horizontal:'center', vertical:'middle', wrapText:true };
        cell.fill={ type:'pattern', pattern:'solid', fgColor:{argb:'FFE2EFD9'} };
        cell.border=tableEdge(idx+1);
      });

      var rowNum=8;
      items.forEach(function(i){
        var c=childrenByCode[i.childCode]||{};
        var d=c.detail||{};
        var vals=[
          i.childCode||'', i.childName||'', c.gender||'', i.villageName||'', i.villageCode||'',
          c.age||'', d.rcStatus||'',
          ynKm(i.attendance), i.attendanceReason||'',
          ynKm(i.health), i.healthReason||'',
          ynKm(i.education), i.educationReason||'',
          ynKm(i.protection), i.protectionReason||'',
          ynKm(i.participation), i.participationReason||''
        ];
        vals.forEach(function(v,idx){
          var col=idx+1;
          var cell=ws.getCell(rowNum,col);
          cell.value=v;
          cell.font=bodyFont;
          cell.alignment={ horizontal:(idx===1?'left':'center'), vertical:'middle', wrapText:true };
          cell.border=tableEdge(col);
          if(!NO_FILL_COLS[col]) cell.fill=whiteFill;
        });
        ws.getRow(rowNum).height=17.5;
        rowNum++;
      });
      // No records yet — still ship a usable blank template, same as the sample file.

<!-- ══ FLYING STARS ENGINE ══════════════════════════════════════════ -->
<script>
(function(){
  var canvas, ctx, stars=[], raf, heroEl;
  var W=0, H=0;

  /* ── Star shapes ─────────────────────────────────── */
  function drawStar(cx,cy,r,pts,inner,rot){
    ctx.beginPath();
    for(var i=0;i<pts*2;i++){
      var angle=rot + i*Math.PI/pts;
      var radius=(i%2===0)?r:inner;
      ctx.lineTo(cx+Math.cos(angle)*radius, cy+Math.sin(angle)*radius);
    }
    ctx.closePath();
  }
  function drawSparkle(cx,cy,r){
    // 4-point diamond sparkle
    ctx.beginPath();
    ctx.moveTo(cx, cy-r);
    ctx.quadraticCurveTo(cx+r*0.15, cy-r*0.15, cx+r, cy);
    ctx.quadraticCurveTo(cx+r*0.15, cy+r*0.15, cx, cy+r);
    ctx.quadraticCurveTo(cx-r*0.15, cy+r*0.15, cx-r, cy);
    ctx.quadraticCurveTo(cx-r*0.15, cy-r*0.15, cx, cy-r);
    ctx.closePath();
  }

  /* ── Create a star particle ──────────────────────── */
  function makeStar(){
    var type=Math.random()<0.5?'star':(Math.random()<0.5?'sparkle':'dot');
    var size=type==='dot'?(1+Math.random()*2):(3+Math.random()*7);
    // start anywhere in hero, drift up and sideways
    return{
      x: Math.random()*W,
      y: H + size + Math.random()*40,   // start just below hero bottom
      vx: (Math.random()-0.5)*0.6,
      vy: -(0.4 + Math.random()*1.0),   // float upward
      size: size,
      type: type,
      rot: Math.random()*Math.PI*2,
      spin: (Math.random()-0.5)*0.03,
      alpha: 0,
      targetAlpha: 0.55 + Math.random()*0.45,
      life: 0,
      maxLife: 200 + Math.random()*300,
      // colour: white, gold, or orange-amber
      hue: Math.random()<0.5?'#ffffff':(Math.random()<0.5?'#ffd54f':'#ffab40'),
      // trail
      trail:[],
    };
  }

  /* ── Resize handler ──────────────────────────────── */
  function resize(){
    if(!heroEl)return;
    var rect=heroEl.getBoundingClientRect();
    W=rect.width; H=rect.height;
    canvas.width=W*window.devicePixelRatio;
    canvas.height=H*window.devicePixelRatio;
    canvas.style.width=W+'px';
    canvas.style.height=H+'px';
    ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  }

  /* ── Draw glow helper ────────────────────────────── */
  function glow(r,color){
    ctx.shadowBlur=r;
    ctx.shadowColor=color;
  }

  /* ── Animation loop ──────────────────────────────── */
  function tick(){
    raf=requestAnimationFrame(tick);
    if(!heroEl || !heroEl.isConnected){ stop(); return; }

    ctx.clearRect(0,0,W,H);

    // Spawn stars up to 38 particles
    if(stars.length<38 && Math.random()<0.18) stars.push(makeStar());

    stars=stars.filter(function(s){ return s.life<s.maxLife && s.y>-s.size*4; });

    stars.forEach(function(s){
      s.life++;
      s.x+=s.vx;
      s.y+=s.vy;
      s.rot+=s.spin;

      // fade in/out
      var progress=s.life/s.maxLife;
      if(progress<0.15) s.alpha=s.targetAlpha*(progress/0.15);
      else if(progress>0.75) s.alpha=s.targetAlpha*((1-progress)/0.25);
      else s.alpha=s.targetAlpha;

      // gentle horizontal sway
      s.x+=Math.sin(s.life*0.04)*0.25;

      ctx.save();
      ctx.globalAlpha=s.alpha;

      if(s.type==='dot'){
        glow(8,s.hue);
        ctx.fillStyle=s.hue;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        ctx.fill();
        // inner bright core
        ctx.shadowBlur=3;
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size*0.4,0,Math.PI*2);
        ctx.fill();
      } else if(s.type==='sparkle'){
        glow(14,s.hue);
        ctx.fillStyle=s.hue;
        drawSparkle(s.x,s.y,s.size);
        ctx.fill();
        ctx.shadowBlur=5;
        ctx.fillStyle='#ffffff';
        drawSparkle(s.x,s.y,s.size*0.4);
        ctx.fill();
      } else {
        // 5-point star
        glow(12,s.hue);
        ctx.fillStyle=s.hue;
        drawStar(s.x,s.y,s.size,5,s.size*0.42,s.rot);
        ctx.fill();
        // bright core
        ctx.shadowBlur=4;
        ctx.fillStyle='#ffffff';
        drawStar(s.x,s.y,s.size*0.38,5,s.size*0.18,s.rot);
        ctx.fill();
      }

      ctx.restore();
    });
  }

  function stop(){
    if(raf) cancelAnimationFrame(raf);
    raf=null;
  }

  /* ── Mount canvas into hero whenever hero exists ─── */
  function mount(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    heroEl=document.querySelector('.rc-hero');
    if(!heroEl){
      // hero not in DOM yet; keep watching
      setTimeout(mount,200);
      return;
    }
    // Check if canvas already mounted
    if(heroEl.querySelector('#rc-star-canvas')){
      // Re-check hero still in DOM
      if(!raf) tick();
      return;
    }
    canvas=document.createElement('canvas');
    canvas.id='rc-star-canvas';
    heroEl.insertBefore(canvas,heroEl.firstChild);
    ctx=canvas.getContext('2d');
    resize();
    window.addEventListener('resize',function(){
      // re-find hero (it may have re-rendered)
      heroEl=document.querySelector('.rc-hero');
      if(heroEl&&canvas&&heroEl.contains(canvas)) resize();
    });
    if(raf) cancelAnimationFrame(raf);
    tick();
  }

  /* ── Re-mount after every render (hero re-created in DOM) ── */
  // Use MutationObserver to watch for hero re-creation
  var appEl=document.getElementById('rc-app');
  if(appEl){
    var obs=new MutationObserver(function(){
      heroEl=document.querySelector('.rc-hero');
      if(heroEl && !heroEl.querySelector('#rc-star-canvas')){
        stop();
        stars=[];
        mount();
      }
    });
    obs.observe(appEl,{childList:true,subtree:true});
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) stop(); else if(canvas&&!raf&&document.contains(canvas)) tick();
  });
  // Initial mount after a brief delay
  setTimeout(mount,300);
})();
</script>

sition:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}\n@keyframes ring{0%{transform:scale(.88);opacity:.55}100%{transform:scale(1.2);opacity:0}}\n#st::after{content:\" · \"}#st.tp::after{content:\"… · \"}\n/* titled data (child details): Title / Label : value */\n.m.kvm{white-space:normal}\n.kvm .kt{font-weight:700;color:var(--brand);margin:12px 0 4px;font-size:.95rem}.kvm .kt:first-child{margin-top:0;font-size:1.06rem;color:var(--ink)}.kvm .kt:nth-child(2){padding-top:8px;border-top:1px solid var(--line)}\n.kvm .kr{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:2px 12px;padding:6px 0;border-bottom:1px dashed var(--line)}\n.kvm .kr:last-child{border-bottom:0}\n.kvm .kk{color:var(--mute);font-size:.84rem;font-weight:600}.kvm .kvv{overflow-wrap:anywhere}\n.kvm .kp{margin:4px 0}\n.kvm table{border-collapse:collapse;width:100%;font-size:.88rem;display:block;overflow-x:auto;margin:6px 0}\n.kvm th{background:rgba(232,100,27,.1);text-align:left;padding:6px 8px;white-space:nowrap}\n.kvm td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}\n/* calendar */\n#cal{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}#cal.on{display:flex}\n.ch{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}\n.ch b{flex:1;min-width:0;font-size:1.02rem;line-height:1.35}.ch small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}\n.ch button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:38px;height:38px;padding:0 9px;font-size:.88rem}\n.cb{flex:1;overflow-y:auto}.cg{display:grid;grid-template-columns:repeat(7,1fr)}\n.cw{background:#0a9b1f;color:#fff;text-align:center;padding:7px 0;font-weight:600;font-size:.82rem}\n.cd{min-height:66px;border:.5px solid var(--line);padding:3px 2px;text-align:center;background:var(--card);cursor:pointer;overflow:hidden;font-size:.68rem;color:var(--mute)}\n.cd.o{opacity:.4}.cd.su{background:#0aa21d;color:#eaffee}.cd.sel{outline:2px solid var(--brand);outline-offset:-2px}\n.cd .n{display:inline-block;min-width:24px;font-size:1rem;font-weight:700;color:var(--ink);border-radius:12px}.cd.ev .n{color:#1a4fd6}.cd.ph .n{color:#d23b2a}.cd.su .n{color:#fff}.cd.td .n{background:var(--brand);color:#fff}\n.pl{display:none;margin-top:2px;padding:1px 4px;border-radius:4px;font-size:.68rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.pl.h{background:#ffd9dc;color:#c0281b}.pl.o{background:#dbe4ff;color:#1a3fd0}.pl.p{background:#fff0c2;color:#7a5200}\n.dots{display:flex;gap:3px;justify-content:center;margin-top:3px}.dots i{width:6px;height:6px;border-radius:50%;background:#1a4fd6}.dots i.h{background:#d23b2a}.dots i.p{background:#e0a100}\n@media(min-width:720px){.cd{min-height:100px}.cd .pl{display:block}.dots{display:none}}\n.cp{padding:12px 14px calc(18px + env(safe-area-inset-bottom))}.pt{font-weight:700;margin-bottom:8px;line-height:1.6}\n.pr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}.pr span{flex:1}.pr.dn span{text-decoration:line-through;opacity:.55}\n.pr button{background:transparent;color:var(--mute);padding:4px 8px}.pr .pl{display:block;font-size:.88rem;padding:4px 8px;white-space:normal}\n.af{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.af input,.af select{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card);color:var(--ink);font:inherit;min-width:0}#pt{flex:1 1 100%}.af button{border-radius:10px;padding:9px 14px;margin-left:auto}\n/* quick chips + input */\n.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}\n.chips button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9 ver{background:rgba(232,100,27,.1)}#att:disabled{opacity:.4}\n#mic{width:42px;height:42px;border-radius:50%;padding:0;background:transparent;color:var(--brand);line-height:1;flex:none;display:grid;place-items:center}\n#mic svg{width:24px;height:24px;display:block}\n#mic:hover{background:rgba(232,100,27,.1)}\n#mic.on{background:#d23b2a;color:#fff;animation:pulse 1s infinite}\n@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(210,59,42,.22)}}\n#send{width:42px;height:42px;border-radius:50%;padding:0;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 6px 14px rgba(232,100,27,.32)}\n#send svg{width:19px;height:19px;fill:#fff}\n.hide{display:none}\n.bar2{position:fixed;top:0;left:0;right:0;z-index:50;display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));font-size:14px;line-height:1.4;text-align:center;color:#fff}\n#offbar{background:#7a4b00}#updbar{background:var(--brand)}#updbar button{border:0;border-radius:999px;padding:8px 16px;min-height:36px;font:inherit;font-weight:600;background:#fff;color:#8a3a00;cursor:pointer}\n@media (max-width:400px){.top{gap:6px;padding-left:10px;padding-right:10px}.ib{width:36px;height:36px}.ttl{min-width:0;overflow:hidden}}\n.fnote{margin-top:6px;font-size:.78rem;line-height:1.5;color:var(--mute)}\n#set,#guide,#usage,#tpl{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;padding-top:env(safe-area-inset-top)}#set.on,#guide.on,#usage.on,#tpl.on{display:flex}\n.tp b{display:block;margin-bottom:6px}.tp .seg{margin-top:4px}\n.ug{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.uc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.uc b{display:block;font-size:1.5rem}.uc small{color:var(--mute)}.ubars{display:flex;align-items:flex-end;gap:3px;height:90px}.ubars i{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}.ut{width:100%;border-collapse:collapse;font-size:.9rem}.ut td{padding:5px 4px;border-bottom:1px solid var(--line)}.ut td:last-child{text-align:right}.ufb{border-top:1px solid var(--line);padding:8px 0;font-size:.88rem;word-break:break-word}\n.sh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}.sh b{flex:1;font-size:1.06rem}\n.sh button,.sx{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}\n.sc{padding:14px 14px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin:0 auto}\n.sr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;line-height:1.6}.sr h3{margin:0 0 6px;font-size:1rem}.sr p{margin:4px 0;color:var(--mute);font-size:.88rem}\n.sr .row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}\n.seg{display:flex;gap:8px}.seg button,.sbtn{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:0 12px}.seg button.sel,.sbtn.sel{background:var(--brand);color:#fff;border-color:var(--brand)}\n.sbtn.red{color:#c0281b;border-color:#c0281b}\n#guide{align-items:center;justify-content:center;padding:20px}.gcard{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px 22px;max-width:420px;width:100%;text-align:center;line-height:1.7}\n.gcard .gi{font-size:44px;line-height:1.2}.gcard h2{margin:10px 0 6px;font-size:1.15rem}.gcard p{margin:0 0 14px;color:var(--mute);font-size:.95rem;white-space:pre-line}\n.gdots{display:flex;gap:6px;justify-content:center;margin:6px 0 16px}.gdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.gdots i.on{background:var(--brand)}\n.gcard .gb{display:flex;gap:8px}.gcard .gb button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}.gcard .gb button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}\n.ver{margin:12px 0 0;font-size:12px;text-align:center;color:var(--mute)}\n@media (min-width:760px){body{padding:20px}.wrap{max-width:760px}#chat{background:var(--glass);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.top{border-radius:28px 28px 0 0}}\n@media (prefers-reduced-motion:reduce){*{animation:none !important;scroll-behavior:auto !important}}\n.cpy+.cpy{margin-left:6px}\n/* Today card */\n.tdy{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px 6px;box-shadow:var(--shadow);animation:pop .24s ease-out both}\n.tdy h4{margin:0 0 4px;font-size:.95rem;line-height:1.6;display:flex;justify-content:space-between;align-items:center;gap:8px}\n.tdy .tl{flex:none;min-width:34px;height:34px;border-radius:999px;background:transparent;color:var(--mute);border:1px solid var(--line);padding:0}\n.tdy .tr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:.9rem;line-height:1.6}\n.tdy .tr.tap{cursor:pointer}.tdy .tr.tap:active{opacity:.6}\n.tdy .ti{flex:none;width:1.6em;text-align:center}.tdy .tx{flex:1;min-width:0;overflow-wrap:anywhere}.tdy small{color:var(--mute)}.tdy .bad{color:#d23b2a;font-weight:600}\n/* install banner */\n#inst{display:none;align-items:center;gap:8px;margin:6px 14px 0;padding:8px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bot);box-shadow:var(--shadow);font-size:.88rem}\n#inst span{flex:1}#inst button{padding:8px 14px;border-radius:999px;font-size:.86rem}#inst button.x{background:none;color:var(--mute);border:1px solid var(--line);font-weight:500;padding:8px 11px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"offbar\" class=\"bar2\" role=\"status\" aria-live=\"polite\">📴 អ្នកមិនមានអ៊ីនធឺណិត / You are offline\u003c/div>\n\u003cdiv id=\"updbar\" class=\"bar2\" role=\"status\" aria-live=\"polite\">\u003cspan>🔄 មានកំណែថ្មី / A new version is ready\u003c/span>\u003cbutton id=\"updbtn\" type=\"button\">ធ្វើបច្ចុប្បន្នភាព / Update\u003c/button>\u003c/div>\n\u003cdiv id=\"set\" role=\"dialog\" aria-modal=\"true\" aria-label=\"ការកំណត់ / Settings\">\n  \u003cdiv class=\"sh\">\u003cb>⚙️ ការកំណត់ / Settings\u003c/b>\u003cbutton id=\"setx\" type=\"button\" aria-label=\"បិទ / Close\">✕\u003c/button>\u003c/div>\n  \u003cdiv class=\"sc\">\n    \u003cdiv class=\"sr\">\u003ch3>🔤 ទំហំអក្សរ / Text size\u003c/h3>\u003cdiv class=\"seg\" id=\"fsz\">\u003cbutton type=\"button\" data-i=\"0\">A\u003c/button>\u003cbutton type=\"button\" data-i=\"1\" style=\"font-size:1.15em\">A\u003c/button>\u003cbutton type=\"button\" data-i=\"2\" style=\"font-size:1.3em\">A\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"sr\">\u003ch3>🌗 រូបរាង / Appearance\u003c/h3>\u003cdiv class=\"seg\" id=\"thm\">\u003cbutton type=\"button\" data-t=\"auto\">ស្វ័យប្រវត្តិ · Auto\u003c/button>\u003cbutton type=\"button\" data-t=\"light\">☀️ ភ្លឺ · Light\u003c/button>\u003cbutton type=\"button\" data-t=\"dark\">🌙 ងងឹត · Dark\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"sr\" id=\"s_inst_r\" style=\"display:none\">\u003cbutton class=\"sbtn\" id=\"s_inst\" type=\"button\" style=\"width:100%\">📲 ដំឡើងកម្មវិធី / Install this app\u003c/button>\u003c/div>\n    \u003cdiv class=\"sr\">\u003cdiv class=\"row\">\u003cspan>🔊 អានចម្លើយដោយស្វ័យប្រវត្តិ\u003cbr>\u003csmall style=\"color:var(--mute)\">Read replies aloud\u003c/small>\u003c/span>\u003cbutton class=\"sbtn\" id=\"s_vol\" type=\"button\" style=\"flex:0 0 96px\">\u003c/button>\u003c/div>\n      \u003cdiv class=\"row\">\u003cspan>🔔 ការជូនដំណឹង\u003cbr>\u003csmall style=\"color:var(--mute)\">RC dates and calendar plans, even when the app is closed\u003c/small>\u003c/span>\u003cbutton class=\"sbtn\" id=\"s_al\" type=\"button\" style=\"flex:0 0 96px\">\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"sr\">\u003cbutton class=\"sbtn\" id=\"s_guide\" type=\"button\" style=\"width:100%\">📖 ការណែនាំរហ័ស / Quick guide\u003c/button>\u003c/div>\n    \u003cdiv class=\"sr\">\u003ch3>🔒 ឯកជនភាព / Privacy\u003c/h3>\u003cp>ព័ត៌មានកុមារប្រើសម្រាប់ការងាររបស់អ្នកប៉ុណ្ណោះ។ ក្នុង RC Monitoring កម្មវិធីនេះនៅតែចូលរហូតដល់អ្នកចាកចេញពី RC Monitoring — សូមចាកចេញជានិច្ចពេលប្រើទូរស័ព្ទរួម។ ផែនការក្នុងប្រតិទិនត្រូវរក្សាទុកដើម្បីជូនដំណឹង — សូមកុំសរសេរឈ្មោះកុមារក្នុងផែនការ។\u003c/p>\u003cp>Child information is for your own work only. Inside RC Monitoring this app stays signed in until you sign out of RC Monitoring, so always sign out on a shared phone. Calendar plans are stored to send reminders, so do not put children's names in plans.\u003c/p>\u003cp>ការសន្ទនាទូទៅ (បកប្រែ សង្ខេប…) ត្រូវរក្សាទុកលើទូរស័ព្ទនេះរហូតដល់អ្នកចាកចេញ។ ព័ត៌មានកុមារមិនត្រូវបានរក្សាទុកទេ។\u003cbr>General helper chats stay on this phone until you sign out. Child information is never kept.\u003c/p>\u003cbutton class=\"sbtn\" id=\"s_clr\" type=\"button\" style=\"width:100%;margin-top:6px\">🗑 លុបការសន្ទនាដែលបានរក្សាទុក / Clear saved chat\u003c/button>\u003c/div>\n    \u003cdiv class=\"sr\">\u003cbutton class=\"sbtn\" id=\"s_tpl\" type=\"button\" style=\"width:100%\">✉️ គំរូលិខិត / Letter templates\u003c/button>\u003c/div>\n    \u003cdiv class=\"sr\" id=\"s_adm\" style=\"display:none\">\u003cbutton class=\"sbtn\" id=\"s_usage\" type=\"button\" style=\"width:100%\">📊 ស្ថិតិប្រើប្រាស់ / Usage (admin)\u003c/button>\u003c/div>\n    \u003cdiv class=\"sr\">\u003cp id=\"s_who\">\u003c/p>\u003cp id=\"s_ver\">\u003c/p>\u003cbutton class=\"sbtn red\" id=\"s_out\" type=\"button\" style=\"width:100%;margin-top:8px\">ចាកចេញ / Sign out\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"tpl\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Letter templates\">\n  \u003cdiv class=\"sh\">\u003cb>✉️ គំរូលិខិត / Letter templates\u003c/b>\u003cbutton id=\"tplx\" type=\"button\" aria-label=\"Close\">✕\u003c/button>\u003c/div>\n  \u003cdiv class=\"sc\">\u003cdiv class=\"sr\">\u003cp>ជ្រើសភាសា ហើយអត្ថបទនឹងចូលក្នុងប្រអប់សារ ដើម្បីកែ និងចម្លង។ ជំនួសអក្សរក្នុង [ ] ។ សូមកុំវាយឈ្មោះកុមារពិតក្នុងកម្មវិធីនេះ ដាក់ក្នុងឯកសារចុងក្រោយវិញ។\u003cbr>Pick a language: the text goes into the message box so you can edit and copy it. Replace the parts in [ ]. Please add real child names only in your final document, not in this app.\u003c/p>\u003c/div>\u003cdiv id=\"tpl_list\">\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv id=\"usage\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Usage\">\n  \u003cdiv class=\"sh\">\u003cb>📊 ស្ថិតិប្រើប្រាស់ / Usage\u003c/b>\u003cbutton id=\"usx\" type=\"button\" aria-label=\"Close\">✕\u003c/button>\u003c/div>\n  \u003cdiv class=\"sc\">\n    \u003cdiv class=\"sr\">\u003cdiv class=\"seg\" id=\"usd\">\u003cbutton type=\"button\" data-d=\"7\">7\u003c/button>\u003cbutton type=\"button\" data-d=\"30\">30\u003c/button>\u003cbutton type=\"button\" data-d=\"90\">90\u003c/button>\u003c/div>\u003cp id=\"us_gen\">\u003c/p>\u003c/div>\n    \u003cdiv id=\"us_body\">\u003c/div>\n    \u003cdiv class=\"sr\">\u003cp>🔒 មិនរក្សាទុកឈ្មោះកុមារ ឬអត្ថបទដែលបានវាយទេ។ បង្ហាញតែសំណួរដែលអ្នកប្រើវាយតម្លៃ 👎។ កំណត់ត្រាលុបក្រោយ ១ ឆ្នាំ។\u003cbr>Typed names and text are not stored. Question text appears only for 👎 ratings. Logs are deleted after 1 year.\u003c/p>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"guide\" role=\"dialog\" aria-modal=\"true\" aria-label=\"ការណែនាំរហ័ស / Quick guide\">\u003cdiv class=\"gcard\">\u003cdiv class=\"gi\" id=\"g_i\">\u003c/div>\u003ch2 id=\"g_t\">\u003c/h2>\u003cp id=\"g_p\">\u003c/p>\u003cdiv class=\"gdots\" id=\"g_d\">\u003c/div>\u003cdiv class=\"gb\">\u003cbutton type=\"button\" id=\"g_skip\">រំលង / Skip\u003c/button>\u003cbutton type=\"button\" class=\"pri\" id=\"g_next\">\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"wrap\">\n  \u003cdiv id=\"login\" class=\"card\">\n    \u003cdiv class=\"logo\" data-av>\u003c/div>\n    \u003ch1>ជំនួយការ CVC\u003c/h1>\n    \u003cp class=\"s\">ចូលដោយប្រើឈ្មោះអ្នកប្រើ និងកូដ PIN របស់អ្នក\u003cbr>Sign in with your dashboard username and PIN\u003c/p>\n    \u003clabel class=\"fld\">\u003cspan>👤\u003c/span>\u003cinput id=\"u\" placeholder=\"ឈ្មោះអ្នកប្រើ / Username\" autocomplete=\"username\" autocapitalize=\"none\">\u003c/label>\n    \u003clabel class=\"fld\">\u003cspan>🔒\u003c/span>\u003cinput id=\"p\" type=\"password\" placeholder=\"កូដ PIN / PIN\" autocomplete=\"current-password\">\u003c/label>\n    \u003cp id=\"err\">\u003c/p>\n    \u003cbutton id=\"go\">ចូល / Sign in\u003c/button>\n    \u003cp class=\"ver\" id=\"ver\">\u003c/p>\n  \u003c/div>\n\n  \u003cdiv id=\"chat\" class=\"hide\" style=\"display:none;flex:1;flex-direction:column;min-height:0\">\n    \u003cdiv class=\"top\">\n      \u003cdiv class=\"av\" data-av>\u003c/div>\n      \u003cdiv class=\"ttl\">\u003cb>ជំនួយការ CVC\u003c/b>\u003csmall>\u003ci class=\"dot\">\u003c/i>\u003cspan id=\"st\">កំពុងសកម្ម\u003c/span>\u003cspan id=\"who\">\u003c/span>\u003c/small>\u003c/div>\n      \u003cbutton id=\"calb\" class=\"ib\" type=\"button\" aria-label=\"ប្រតិទិន / Calendar\" title=\"ប្រតិទិន / Calendar\">📅\u003c/button>\n      \u003cbutton id=\"alertb\" class=\"ib\" type=\"button\" aria-label=\"ការជូនដំណឹង / Alerts\" title=\"ការជូនដំណឹង / Alerts\">🔕\u003c/button>\u003cbutton id=\"vol\" class=\"ib\" type=\"button\" aria-label=\"អានចម្លើយដោយស្វ័យប្រវត្តិ / Auto-read replies\" title=\"Auto-read replies\">🔇\u003c/button>\n      \u003cbutton id=\"setb\" class=\"ib\" type=\"button\" aria-label=\"ការកំណត់ / Settings\" title=\"ការកំណត់ / Settings\">⚙️\u003c/button>\u003cbutton id=\"out\" class=\"ib\" type=\"button\" aria-label=\"ចេញ / Sign out\" title=\"ចេញ / Sign out\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"/>\u003cpath d=\"M16 17l5-5-5-5\"/>\u003cpath d=\"M21 12H9\"/>\u003c/svg>\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"log\" aria-live=\"polite\">\u003c/div>\n    \u003cdiv id=\"inst\">\u003cspan>📲 ដំឡើងកម្មវិធីនេះលើអេក្រង់ដើម · Install this app\u003c/span>\u003cbutton type=\"button\" id=\"instgo\">ដំឡើង / Install\u003c/button>\u003cbutton type=\"button\" id=\"instx\" class=\"x\" aria-label=\"Close\">✕\u003c/button>\u003c/div>\n    \u003cdiv class=\"chips\" id=\"chips\">\n      \u003cbutton type=\"button\" data-cal=\"1\">📅 ប្រតិទិន\u003c/button>\n      \u003cbutton type=\"button\" data-wv=\"1\">🌍 អំពីអង្គការទស្សនៈពិភពលោក\u003c/button>\n      \u003cbutton type=\"button\" data-cp=\"1\">🛡️ ការការពារកុមារ · Do &amp; Don’t\u003c/button>\n      \u003cbutton type=\"button\" data-t=\"កុមាររបស់ខ្ញុំ\" data-send=\"1\">👥 កុមាររបស់ខ្ញុំ\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"rec\">\u003cspan id=\"recmsg\">\u003c/span>\u003cbutton type=\"button\" id=\"recok\">✔ បញ្ចប់\u003c/button>\u003cbutton type=\"button\" id=\"recx\" class=\"x\">✖ បោះបង់\u003c/button>\u003c/div>\n    \u003cdiv id=\"chips\">\u003cbutton type=\"button\" id=\"dashtg\" aria-pressed=\"false\" style=\"display:none\">📊 ទិន្នន័យ Dashboard / Dashboard data: Off\u003c/button>\u003cspan id=\"dashviews\" style=\"display:none\">\u003c/span>\u003cspan id=\"attchip\" style=\"display:none\">\u003cspan id=\"attname\">\u003c/span>\u003cbutton type=\"button\" id=\"attx\" aria-label=\"Remove file\">✕\u003c/button>\u003c/span>\u003c/div>\n    \u003cform class=\"in\" id=\"f\">\u003cdiv class=\"box\">\u003ctextarea id=\"q\" rows=\"1\" autocomplete=\"off\" placeholder=\"សួរ ឬបិទភ្ជាប់អត្ថបទ… / Ask or paste text…\">\u003c/textarea>\u003cbutton type=\"button\" id=\"att\" aria-label=\"ភ្ជាប់ឯកសារ / Attach file (Word, PDF, Excel, photo)\" title=\"ភ្ជាប់ឯកសារ / Attach file (Word, PDF, Excel, photo)\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M21 11.5 12.4 20a5.5 5.5 0 0 1-7.8-7.8l8.6-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-8\"/>\u003c/svg>\u003c/button>\u003cinput type=\"file\" id=\"attf\" accept=\"image/*,.pdf,.docx,.xlsx,.csv,.txt\" hidden>\u003cbutton type=\"button\" id=\"mic\" aria-label=\"ថតសំឡេង / Record voice\" title=\"ថតសំឡេង / Record voice\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath fill=\"currentColor\" d=\"M12 15.5a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5.5a4 4 0 0 0 4 4z\"/>\u003cpath fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.2\"/>\u003c/svg>\u003c/button>\u003cbutton id=\"send\" aria-label=\"ផ្ញើ / Send\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M3.4 20.4 21 12 3.4 3.6 3.3 10l12.5 2-12.5 2z\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/form>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"cal\">\u003cdiv class=\"ch\">\u003cbutton id=\"cx\" type=\"button\">✕\u003c/button>\u003cbutton id=\"cpv\" type=\"button\">‹\u003c/button>\u003cbutton id=\"cnx\" type=\"button\">›\u003c/button>\u003cb id=\"ct\">\u003c/b>\u003cbutton id=\"ctd\" type=\"button\">ថ្ងៃនេះ\u003c/button>\u003cbutton id=\"cbell\" type=\"button\">🔕\u003c/button>\u003c/div>\u003cdiv class=\"cb\">\u003cdiv class=\"cg\" id=\"cgh\">\u003c/div>\u003cdiv class=\"cg\" id=\"cgd\">\u003c/div>\u003cdiv class=\"cp\" id=\"cpan\">\u003c/div>\u003c/div>\u003c/div>\n\u003cscript>\nconst API_URL = 'https://script.google.com/macros/s/AKfycbwkFwA3wIZmJfMrIRVRhw8gTAX_MJhQ24rkRHryfQwsqUHRSmGlCXRF64J1ngPxO5BZ_Q/exec';\nconst $ = id => document.getElementById(id);\nconst EMBED = true;   // this copy runs inside RC Monitoring (iframe)\nlet token = null, attached = null, dashOn = false;\nlet chatHist = [];   // only general-helper turns (translate/summarize); child answers are never kept or sent back\ntry { token = sessionStorage.getItem('cvc_t'); } catch (e) {}\ntry { const g = new URLSearchParams(location.search).get('go'); if (g) { sessionStorage.setItem('cvc_go', g); history.replaceState(null, '', location.pathname); } } catch (e) {}   // home-screen shortcuts open /?go=cal or /?go=cp\n\n/* ---------------- human avatar (one drawing, used for logo, header and message bubbles) ---------------- */\nconst ROBOT = p => `\u003csvg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cdefs>\u003cradialGradient id=\"${p}bg\" cx=\"50%\" cy=\"35%\" r=\"80%\">\u003cstop offset=\"0\" stop-color=\"#ffb877\"/>\u003cstop offset=\"1\" stop-color=\"#e8641b\"/>\u003c/radialGradient>\u003clinearGradient id=\"${p}hd\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#ffffff\"/>\u003cstop offset=\".55\" stop-color=\"#e6ebf2\"/>\u003cstop offset=\"1\" stop-color=\"#a9b4c6\"/>\u003c/linearGradient>\u003clinearGradient id=\"${p}bd\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#f5f7fb\"/>\u003cstop offset=\"1\" stop-color=\"#9aa6ba\"/>\u003c/linearGradient>\u003clinearGradient id=\"${p}vs\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#2b3858\"/>\u003cstop offset=\"1\" stop-color=\"#080d1c\"/>\u003c/linearGradient>\u003cradialGradient id=\"${p}ey\" cx=\"50%\" cy=\"40%\" r=\"65%\">\u003cstop offset=\"0\" stop-color=\"#eaffff\"/>\u003cstop offset=\".5\" stop-color=\"#5ff0ff\"/>\u003cstop offset=\"1\" stop-color=\"#139fd0\"/>\u003c/radialGradient>\u003clinearGradient id=\"${p}pd\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#ffb877\"/>\u003cstop offset=\"1\" stop-color=\"#d9540f\"/>\u003c/linearGradient>\u003cradialGradient id=\"${p}bl\" cx=\"38%\" cy=\"35%\" r=\"70%\">\u003cstop offset=\"0\" stop-color=\"#fff6d6\"/>\u003cstop offset=\".45\" stop-color=\"#ffb347\"/>\u003cstop offset=\"1\" stop-color=\"#e8641b\"/>\u003c/radialGradient>\u003c/defs>\u003crect width=\"200\" height=\"200\" fill=\"url(#${p}bg)\"/>\u003ccircle cx=\"100\" cy=\"92\" r=\"70\" fill=\"#fff\" opacity=\".1\"/>\u003cellipse class=\"shadow\" cx=\"100\" cy=\"190\" rx=\"38\" ry=\"6\" fill=\"#5a2406\" opacity=\".35\"/>\u003cg class=\"robot\">\u003crect x=\"39\" y=\"140\" width=\"16\" height=\"34\" rx=\"8\" fill=\"url(#${p}bd)\"/>\u003ccircle cx=\"47\" cy=\"173\" r=\"8\" fill=\"url(#${p}pd)\"/>\u003cg class=\"arm\">\u003crect x=\"145\" y=\"140\" width=\"16\" height=\"34\" rx=\"8\" fill=\"url(#${p}bd)\"/>\u003ccircle cx=\"153\" cy=\"173\" r=\"8\" fill=\"url(#${p}pd)\"/>\u003c/g>\u003crect x=\"58\" y=\"130\" width=\"84\" height=\"56\" rx=\"26\" fill=\"url(#${p}bd)\"/>\u003crect x=\"80\" y=\"146\" width=\"40\" height=\"24\" rx=\"11\" fill=\"#0f1730\"/>\u003ccircle class=\"heart\" cx=\"100\" cy=\"158\" r=\"6\" fill=\"url(#${p}bl)\"/>\u003ccircle cx=\"88\" cy=\"158\" r=\"2\" fill=\"#5ff0ff\" opacity=\".8\"/>\u003ccircle cx=\"112\" cy=\"158\" r=\"2\" fill=\"#5ff0ff\" opacity=\".8\"/>\u003cpath d=\"M66 140c6-5 14-7 22-7\" stroke=\"#fff\" stroke-width=\"3\" opacity=\".6\" fill=\"none\" stroke-linecap=\"round\"/>\u003crect x=\"88\" y=\"122\" width=\"24\" height=\"12\" rx=\"5\" fill=\"#8794a8\"/>\u003cg class=\"head\">\u003cline x1=\"100\" y1=\"36\" x2=\"100\" y2=\"22\" stroke=\"#8794a8\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ccircle class=\"ball\" cx=\"100\" cy=\"17\" r=\"7.5\" fill=\"url(#${p}bl)\"/>\u003ccircle cx=\"97.5\" cy=\"14.5\" r=\"2.2\" fill=\"#fff\" opacity=\".8\"/>\u003crect class=\"ear\" x=\"28\" y=\"66\" width=\"14\" height=\"32\" rx=\"7\" fill=\"url(#${p}pd)\"/>\u003crect class=\"ear\" x=\"158\" y=\"66\" width=\"14\" height=\"32\" rx=\"7\" fill=\"url(#${p}pd)\"/>\u003crect x=\"38\" y=\"34\" width=\"124\" height=\"94\" rx=\"36\" fill=\"url(#${p}hd)\" stroke=\"#c3ccd9\" stroke-width=\"1.5\"/>\u003cpath d=\"M54 52c10-11 30-15 52-14\" stroke=\"#fff\" stroke-width=\"5\" opacity=\".75\" fill=\"none\" stroke-linecap=\"round\"/>\u003cpath d=\"M56 118c14 8 74 8 88 0\" stroke=\"#8f9bb0\" stroke-width=\"3\" opacity=\".35\" fill=\"none\" stroke-linecap=\"round\"/>\u003crect x=\"50\" y=\"53\" width=\"100\" height=\"58\" rx=\"26\" fill=\"url(#${p}vs)\" stroke=\"#3d4c73\" stroke-width=\"1.5\"/>\u003cpath d=\"M60 68q5-9 20-11l32-1q-20 6-44 18z\" fill=\"#fff\" opacity=\".13\"/>\u003cg class=\"eyes\">\u003ccircle cx=\"78\" cy=\"82\" r=\"14\" fill=\"#5ff0ff\" opacity=\".16\"/>\u003ccircle cx=\"122\" cy=\"82\" r=\"14\" fill=\"#5ff0ff\" opacity=\".16\"/>\u003crect class=\"eye\" x=\"70\" y=\"71\" width=\"16\" height=\"22\" rx=\"8\" fill=\"url(#${p}ey)\"/>\u003crect class=\"eye\" x=\"114\" y=\"71\" width=\"16\" height=\"22\" rx=\"8\" fill=\"url(#${p}ey)\"/>\u003ccircle cx=\"75\" cy=\"76\" r=\"2.3\" fill=\"#fff\"/>\u003ccircle cx=\"119\" cy=\"76\" r=\"2.3\" fill=\"#fff\"/>\u003c/g>\u003cpath class=\"mouth\" d=\"M89 100q11 8 22 0\" stroke=\"#5ff0ff\" stroke-width=\"3.4\" fill=\"none\" stroke-linecap=\"round\"/>\u003ccircle class=\"led\" cx=\"60\" cy=\"102\" r=\"3\" fill=\"#ff9a3c\"/>\u003ccircle class=\"led\" cx=\"140\" cy=\"102\" r=\"3\" fill=\"#ff9a3c\"/>\u003c/g>\u003c/g>\u003c/svg>`;\nlet avN = 0;\ndocument.querySelectorAll('[data-av]').forEach(e => { e.innerHTML = ROBOT('r' + (avN++) + '_'); });\ndocument.documentElement.style.setProperty('--avimg', 'url(\"data:image/svg+xml;utf8,' + encodeURIComponent(ROBOT('b_')) + '\")');\nlet talkId = 0;\nconst botEls = () => document.querySelectorAll('.av,.logo');\nfunction mode(c, on) { botEls().forEach(e => e.classList.toggle(c, on)); }\nfunction talking(on) { mode('talk', on); }\nfunction setBusy(on) { mode('think', on); $('st').classList.toggle('tp', on); $('st').textContent = on ? 'កំពុងវាយ' : 'កំពុងសកម្ម'; }\nfunction wave() { mode('wave', false); void document.body.offsetWidth; mode('wave', true); setTimeout(() => mode('wave', false), 1600); }\nbotEls().forEach(e => { e.style.cursor = 'pointer'; e.addEventListener('click', wave); });\nsetTimeout(wave, 700); setInterval(() => { if (!document.hidden) wave(); }, 9000);\ndocument.addEventListener('pointermove', e => {   // the robot's eyes follow your finger / mouse\n  document.querySelectorAll('.eyes').forEach(g => {\n    const r = g.ownerSVGElement.getBoundingClientRect(); if (!r.width) return;\n    const k = v => Math.max(-1, Math.min(1, v / 260));\n    g.style.transform = 'translate(' + (k(e.clientX - r.left - r.width / 2) * 5).toFixed(1) + 'px,' + (k(e.clientY - r.top - r.height / 2) * 3.5).toFixed(1) + 'px)';\n  });\n});\n\ntry { fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'warm' }) }).catch(() => {}); } catch (e) {}\nasync function call(body, ms) {\n  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms || 30000);   // Apps Script cold starts can be slow\n  try {\n    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ token }, body)), signal: ac.signal });\n    const t = await r.text();\n    try { return JSON.parse(t); } catch (e) { console.error('Bad server response:', t.slice(0, 200)); throw new Error('BAD_RESPONSE'); }\n  } finally { clearTimeout(tm); }\n}\nconst NETMSG = e => (!navigator.onLine)\n  ? 'អ្នកមិនមានអ៊ីនធឺណិត សូមភ្ជាប់ហើយព្យាយាមម្តងទៀត។\\nYou are offline. Connect to the internet and try again.'\n  : (e && e.name === 'AbortError')\n  ? 'ចម្លើយយឺតពេក សូមព្យាយាមម្តងទៀត។\\nTook too long. Please try again.'\n  : 'មិនអាចភ្ជាប់បាន សូមពិនិត្យអ៊ីនធឺណិត ហើយព្យាយាមម្តងទៀត។\\nCannot connect. Please check your internet and try again.';\nfunction show(chat) {\n  $('login').style.display = chat ? 'none' : '';\n  $('chat').style.display = chat ? 'flex' : 'none';\n}\n// Turns [label](https://...) into safe clickable links; everything else stays plain text.\nfunction link(parent, text) {\n  const re = /\\[([^\\]]+)\\]\\((https:\\/\\/[^)\\s]+|sso:rcmon|sso:view:[a-z]+)\\)/g; let i = 0, m;\n  while ((m = re.exec(text))) {\n    parent.appendChild(document.createTextNode(text.slice(i, m.index)));\n    const a = document.createElement('a'); a.textContent = m[1];\n    if (m[2] === 'sso:rcmon') { a.href = '#'; a.onclick = openMonitor; }\n    else if (m[2].indexOf('sso:view:') === 0) { a.href = '#'; const t = m[2].slice(9); a.onclick = ev => { ev.preventDefault(); openView(t); }; }\n    else { a.href = m[2]; a.target = '_blank'; a.rel = 'noopener'; }\n    parent.appendChild(a); i = re.lastIndex;\n  }\n  parent.appendChild(document.createTextNode(text.slice(i)));\n}\nfunction fill(el, text) { el.classList.remove('typing'); el.textContent = ''; link(el, text); }\n// Child details: shows a TITLE for each part and \"Label  value\" rows (also draws | tables with header cells).\nfunction fmt(el, text) {\n  const lines = String(text).split('\\n'), out = document.createDocumentFragment();\n  const kvre = /^[\\s•\\-–*]*([^:：៖|]{1,45}?)\\s*[:：៖]\\s+(\\S.*)$/, ttre = /^[\\s#*]*(.{1,60}?)\\s*[:：៖]\\s*\\**$/;\n  let n = 0, rows = null;\n  const flush = () => {\n    if (!rows) return;\n    const t = document.createElement('table'), hasHead = rows.head;\n    const mk = (cells, tag) => { const tr = document.createElement('tr'); cells.forEach(c => { const x = document.createElement(tag); link(x, c); tr.appendChild(x); }); t.appendChild(tr); };\n    if (hasHead) mk(rows.head, 'th'); rows.body.forEach(r => mk(r, 'td'));\n    out.appendChild(t); rows = null; n++;\n  };\n  lines.forEach(raw => {\n    const ln = raw.trim();\n    if (!ln) { flush(); return; }\n    if (/^[\\s|:\\-]+$/.test(ln) && ln.includes('-')) { if (rows && !rows.head && rows.body.length === 1) { rows.head = rows.body.shift(); } return; }\n    if ((ln.match(/\\|/g) || []).length >= 2) {\n      const cells = ln.replace(/^\\||\\|$/g, '').split('|').map(c => c.trim());\n      if (!rows) rows = { head: null, body: [] }; rows.body.push(cells); return;\n    }\n    flush();\n    let m;\n    if ((m = ln.match(kvre))) {\n      const r = document.createElement('div'); r.className = 'kr';\n      const k = document.createElement('div'); k.className = 'kk'; k.textContent = m[1].replace(/\\*+/g, '');\n      const v = document.createElement('div'); v.className = 'kvv'; link(v, m[2].replace(/\\*+/g, ''));\n      r.append(k, v); out.appendChild(r); n++;\n    } else if ((m = ln.match(ttre)) || (/^\\p{Extended_Pictographic}/u.test(ln) && ln.length \u003c= 60)) {\n      const t = document.createElement('div'); t.className = 'kt'; link(t, (m ? m[1] : ln).replace(/\\*+/g, '')); out.appendChild(t); n++;\n    } else { const p = document.createElement('div'); p.className = 'kp'; link(p, ln); out.appendChild(p); }\n  });\n  flush();\n  if (!n) { fill(el, text); addCopy(el); return; }\n  el.classList.remove('typing'); el.textContent = ''; el.classList.add('kvm'); el.appendChild(out); addCopy(el);\n}\n// Opens RC Monitoring already signed in: asks the server for a one-time link (valid 2 minutes).\nasync function openMonitor(e) {\n  e.preventDefault();\n  if (EMBED) { try { parent.postMessage({ type: 'cva-close' }, '*'); } catch (x) {} return; }\n  const w = window.open('', '_blank'); // opened first so phone browsers don't block it\n  try {\n    const d = await call({ action: 'sso' });\n    if (d.ok && d.url) { if (w) w.location.href = d.url; else location.href = d.url; return; }\n    throw new Error(d.message || 'failed');\n  } catch (err) { if (w) w.close(); alert('Cannot open RC Monitoring. Please try again.'); }\n}\n// Opens ONE dashboard section (no menu, no header), already signed in (one-time link, valid 2 minutes). Admin / DASH_ROLES only.\nasync function openView(tab) {\n  const w = window.open('', '_blank');   // opened first so phone browsers don't block it\n  try {\n    const d = await call({ action: 'sso', target: 'view', tab });\n    if (d.ok && d.url) { if (w) w.location.href = d.url; else location.href = d.url; return; }\n    throw new Error(d.message || 'failed');\n  } catch (err) { if (w) w.close(); alert('មិនអាចបើក Dashboard បានទេ។ / Cannot open the dashboard section. ' + (err && err.message && err
